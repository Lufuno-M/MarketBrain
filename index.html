<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MarketBrain</title>
<style>
:root{--bg:#fff;--ink:#111827;--mute:#6b7280;--faint:#9ca3af;--line:#eceef2;--glow:#fff1b8;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 520px at 50% -140px,var(--glow),transparent 70%) no-repeat,var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{max-width:960px;margin:0 auto;padding:56px 28px 28px}
h1{font-size:clamp(44px,8vw,84px);font-weight:700;letter-spacing:-.04em;margin:0;line-height:1}
header p{font-size:clamp(19px,2.6vw,26px);color:var(--mute);margin:18px 0 22px;max-width:30em;line-height:1.35}
.tv{display:inline-block;font-size:15px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:9px 16px;background:#ffffffb0;transition:border-color .3s}
.tv:hover,.tv:focus-visible{border-color:var(--ink);outline:none}
main{max-width:960px;margin:0 auto;padding:0 28px 96px}
h2{font-size:15px;font-weight:600;color:var(--faint);margin:44px 0 6px}
.m{border-top:1px solid var(--line)}
.m>button{all:unset;display:block;width:100%;cursor:pointer;padding:26px 0}
.m>button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.n{font-size:15px;font-weight:600;color:var(--mute)}
.s{font-size:clamp(26px,4.4vw,44px);font-weight:600;letter-spacing:-.025em;line-height:1.14;margin-top:6px;transition:opacity .6s}
.s.w{color:var(--faint)}
.p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease,opacity .5s;opacity:0}
.m.open .p{grid-template-rows:1fr;opacity:1}
.p>div{overflow:hidden}
.why{font-size:18px;line-height:1.5;color:#374151;max-width:38em;margin:0 0 18px;padding:0;list-style:none}
.why li{margin:0 0 10px}
.ch{height:320px;margin:6px 0 16px}
.f{padding-bottom:30px;font-size:14px;color:var(--faint)}
.f a{color:var(--ink);margin-right:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
<h1>MarketBrain</h1>
<p>What the market did while you weren't looking, in plain words. Open any market to see why we say it.</p>
<a class="tv" href="https://www.tradingview.com/" target="_blank" rel="noopener">Open TradingView</a>
</header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
// ---- markets. Add or remove rows here. on:false hides a market until you switch it on.
const MARKETS=[
 {g:'Crypto',k:'BTC',name:'Bitcoin',src:'binance',sym:'BTCUSDT',tv:'BINANCE:BTCUSDT'},
 {g:'Crypto',k:'ETH',name:'Ethereum',src:'binance',sym:'ETHUSDT',tv:'BINANCE:ETHUSDT'},
 {g:'Crypto',k:'SOL',name:'Solana',src:'binance',sym:'SOLUSDT',tv:'BINANCE:SOLUSDT'},
 {g:'Forex and gold',k:'GBPUSD',name:'Pound / Dollar',src:'file',tv:'FX:GBPUSD'},
 {g:'Forex and gold',k:'EURUSD',name:'Euro / Dollar',src:'file',tv:'FX:EURUSD'},
 {g:'Forex and gold',k:'XAUUSD',name:'Gold / Dollar',src:'file',tv:'OANDA:XAUUSD'},
 {g:'Forex and gold',k:'DXY',name:'Dollar Index',src:'file',tv:'TVC:DXY'},
 {g:'Indices',k:'SPX500',name:'S&P 500',src:'file',tv:'OANDA:SPX500USD',on:false},
 {g:'Indices',k:'US30',name:'Dow Jones',src:'file',tv:'OANDA:US30USD',on:false},
 {g:'Indices',k:'NAS100',name:'Nasdaq 100',src:'file',tv:'OANDA:NAS100USD',on:false}
];
const fmt=p=>p.toFixed(p<10?5:p<1000?3:2);
const ny=t=>new Date(t).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' New York time';

// ---- the reading. Candles: [{t,o,h,l,c}] oldest first, 15 minutes each.
function read(c){
 const last=c[c.length-1],gaps=[];
 for(let i=2;i<c.length;i++){const a=c[i-2],b=c[i];
  if(a.h<b.l)gaps.push({up:true,lo:a.h,hi:b.l,i});
  else if(a.l>b.h)gaps.push({up:false,lo:b.h,hi:a.l,i});}
 const open=gaps.filter(g=>{for(let j=g.i+1;j<c.length;j++){const k=c[j];if(g.up?k.l<=g.lo:k.h>=g.hi)return false}return true});
 const mid=g=>(g.lo+g.hi)/2;
 const near=open.sort((a,b)=>Math.abs(mid(a)-last.c)-Math.abs(mid(b)-last.c))[0];
 let run=0;
 if(near)for(let j=c.length-1;j>near.i&&c[j].c>=near.lo&&c[j].c<=near.hi;j--)run++;
 // last swing leg (a swing = highest or lowest of 3 candles either side)
 let sh=null,sl=null;
 for(let i=c.length-4;i>=3&&(!sh||!sl);i--){const w=c.slice(i-3,i+4);
  if(!sh&&c[i].h===Math.max(...w.map(x=>x.h)))sh={i,p:c[i].h};
  if(!sl&&c[i].l===Math.min(...w.map(x=>x.l)))sl={i,p:c[i].l};}
 let fib=null;
 if(sh&&sl){const down=sl.i>sh.i,range=sh.p-sl.p,end=down?sl.p:sh.p;
  fib={down,from:down?sh.p:sl.p,to:end,back:Math.abs(last.c-end)/range,
   lvl:r=>down?sl.p+r*range:sh.p-r*range};}
 return{last,near,run,fib};
}
function sentence(r){
 const{last,near,run}=r;
 if(!near)return'No open gaps nearby. Nothing here needs your attention.';
 const side=near.up?'buying':'selling';
 if(last.c>=near.lo&&last.c<=near.hi)return`Price is sitting inside a ${side} gap and has stayed there for ${run*15} minutes.`;
 const above=near.lo>last.c;
 return`The closest open ${side} gap is ${above?'above':'below'} price, and price hasn't come back to it yet.`;
}
function why(r){
 const{near,fib,last}=r,L=[];
 L.push('A gap is a spot where three candles in a row moved so fast that the middle one left a space the first and third never touched. Markets often come back to check these.');
 if(near)L.push(`The closest open one sits between ${fmt(near.lo)} and ${fmt(near.hi)}. It is "open" because nothing has traded fully through it since. Price is now ${fmt(last.c)}.`);
 if(fib){const pct=Math.round(fib.back*100);
  L.push(`The latest swing ran ${fib.down?'down':'up'} from ${fmt(fib.from)} to ${fmt(fib.to)}. Price has since pulled back ${pct}% of that move. The 50% level is ${fmt(fib.lvl(.5))} and the 70.5% level is ${fmt(fib.lvl(.705))}.`);}
 L.push('This describes what the chart shows. It is not a prediction or advice.');
 return L.map(x=>`<li>${x}</li>`).join('');
}

// ---- data
async function binance(sym){
 const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=15m&limit=300`);
 if(!r.ok)throw 0;return(await r.json()).map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
}
const TWELVE_KEY='PASTE_YOUR_TWELVE_DATA_KEY_HERE';
const FX={GBPUSD:'GBP/USD',EURUSD:'EUR/USD',XAUUSD:'XAU/USD',DXY:'DXY',SPX500:'SPX',US30:'DJI',NAS100:'IXIC'};
let fxP=null;
function fxAll(){
 if(fxP)return fxP;
 const keys=MARKETS.filter(m=>m.src==='file'&&m.on!==false).map(m=>m.k);
 fxP=(async()=>{
  try{const c=JSON.parse(localStorage.getItem('mb_fx'));if(c&&Date.now()-c.at<9e5)return c.d}catch(e){}
  if(TWELVE_KEY.startsWith('PASTE'))throw 'nokey';
  const j=await(await fetch('https://api.twelvedata.com/time_series?interval=15min&outputsize=300&timezone=UTC&apikey='+TWELVE_KEY+'&symbol='+keys.map(k=>FX[k]).join(','))).json();
  const d={};
  keys.forEach(k=>{const v=keys.length===1?j:j[FX[k]];if(v&&v.values)d[k]=v.values.map(x=>({t:Date.parse(x.datetime.replace(' ','T')+'Z'),o:+x.open,h:+x.high,l:+x.low,c:+x.close})).reverse()});
  try{localStorage.setItem('mb_fx',JSON.stringify({at:Date.now(),d}))}catch(e){}
  return d;
 })();
 return fxP;
}
async function forex(key){const d=await fxAll();if(!d[key]||d[key].length<30)throw 'missing';return d[key]}

// ---- page
const app=document.getElementById('app');let group='';
for(const m of MARKETS){if(m.on===false)continue;
 if(m.g!==group){group=m.g;app.insertAdjacentHTML('beforeend',`<h2>${group}</h2>`);}
 const el=document.createElement('section');el.className='m';
 el.innerHTML=`<button aria-expanded="false"><div class="n">${m.k} · ${m.name}</div><div class="s w">Reading the last few hours…</div></button><div class="p"><div><ul class="why"></ul><div class="ch"></div><div class="f"><a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(m.tv)}" target="_blank" rel="noopener">See it on TradingView</a>Latest candle: <span class="at"></span></div></div></div>`;
 app.appendChild(el);
 const s=el.querySelector('.s');let res=null,candles=null,chart=null;
 (m.src==='binance'?binance(m.sym):forex(m.k)).then(c=>{candles=c;res=read(c);
  s.textContent=sentence(res);s.classList.remove('w');
  el.querySelector('.why').innerHTML=why(res);el.querySelector('.at').textContent=ny(c[c.length-1].t);
 }).catch(e=>{s.textContent=e==='nokey'?'Add your Twelve Data key at the top of index.html to turn this on.':m.src==='file'?'No data came back for this market. Check the key and the market name.':'Couldn\'t reach the price feed. Try again in a moment.';});
 const b=el.querySelector('button');
 b.onclick=()=>{const o=el.classList.toggle('open');b.setAttribute('aria-expanded',o);
  if(o&&res&&!chart){chart=LightweightCharts.createChart(el.querySelector('.ch'),{layout:{background:{color:'#fff'},textColor:'#6b7280'},grid:{vertLines:{color:'#f3f4f6'},horzLines:{color:'#f3f4f6'}},rightPriceScale:{borderVisible:false},timeScale:{timeVisible:true,borderVisible:false}});
   const sr=chart.addCandlestickSeries({upColor:'#111827',downColor:'#d1d5db',borderVisible:false,wickUpColor:'#111827',wickDownColor:'#9ca3af'});
   sr.setData(candles.slice(-200).map(x=>({time:x.t/1000,open:x.o,high:x.h,low:x.l,close:x.c})));
   const pl=(price,title,color)=>sr.createPriceLine({price,title,color,lineWidth:1,lineStyle:2});
   if(res.near){pl(res.near.hi,'gap','#d4a017');pl(res.near.lo,'gap','#d4a017');}
   if(res.fib){pl(res.fib.lvl(.5),'50%','#6b7280');pl(res.fib.lvl(.705),'70.5%','#6b7280');}
   chart.timeScale().fitContent();}};
}
</script></body></html>
