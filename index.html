<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarketBrain</title>
<style>
:root{--bg:#fff;--ink:#111827;--mute:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--hue:206,216,238;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--ink:#eef0f4;--mute:#9aa3b2;--faint:#6b7280;--line:#232833}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.glow{position:fixed;left:50%;top:22%;width:110vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;filter:blur(34px);pointer-events:none;opacity:.7;
background:radial-gradient(closest-side,rgba(var(--hue),.7),rgba(var(--hue),0));transition:background 2.4s ease}
main{position:relative;max-width:720px;margin:0 auto;padding:22px 22px 60px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
.away{margin-top:26px;color:var(--mute);font-size:13px}
.away b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);margin:10px 0 0}
.lead{font-size:clamp(24px,5vw,36px);line-height:1.2;font-weight:600;letter-spacing:-.025em;margin:34px 0 8px;min-height:88px}
.sum{color:var(--mute);font-size:16px;line-height:1.5;min-height:74px}
.fade{animation:in 1.5s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
section{border-top:1px solid var(--line);margin-top:34px;padding-top:16px}
h2{font-size:15px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
h2 span{color:var(--faint);font-weight:400;margin-left:8px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:7px 0;font-size:15px;line-height:1.4}
.ev time{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.ev small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.ev.old{opacity:.38}
.gap{color:var(--faint);font-size:12px;padding:8px 0 8px 64px}
.obj{padding:16px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj h3{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.obj dl{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;margin:0;font-size:14px}
.obj dt{color:var(--faint)}.obj dd{margin:0;color:var(--ink)}
.obj .made{color:var(--faint);font-size:12px;margin-top:8px}
.none{color:var(--faint);font-size:14px}
.foot{margin-top:40px;color:var(--faint);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<main>
  <h1>MarketBrain</h1>
  <div class="away">You last looked at <b id="lt"></b>. It is 08:30.
    <input type="range" id="left" min="0" max="630" step="5" value="240" aria-label="when you last looked">
  </div>
  <div class="lead" id="lead"></div>
  <div class="sum" id="sum"></div>

  <section><h2>Timeline <span id="tc"></span></h2><div id="tl"></div></section>
  <section><h2>Open <span id="oc"></span></h2><div id="open"></div></section>
  <section><h2>Resolved <span id="rc"></span></h2><div id="res"></div></section>

  <div class="foot">A sample night, events written by hand. No prices, no candles. Everything above is projected from the event log,
  and every region names the detector that made it. Obligations exist only where you declared them.</div>
</main>

<script>
// THE LOG. This is the only data the page reads. Append events, never edit old ones.
// t = minutes after 22:00. Sample night, hand-written, not market data.
const REG={
 low70:{name:'Swing low',lvl:'82,870',by:'SwingExtremum v1 · 1m · n=2'},
 fvg:{name:'Fair value gap',lvl:'82,920 – 82,940',by:'FairValueGap v1 · 5m'},
 pool:{name:'Liquidity pool',lvl:'83,100',by:'EqualHighs v1 · 5m · tolerance $3'},
 low58:{name:'Swing low',lvl:'82,858',by:'SwingExtremum v1 · 1m · n=2'},
 hi02:{name:'Swing high',lvl:'83,102',by:'SwingExtremum v1 · 1m · n=2'}};
const E=[
 {t:48,k:'Detected',r:'low70'},
 {t:50,k:'Declared',o:'ob1',text:'82,870 holds if it is swept',r:'low70'},
 {t:95,k:'Detected',r:'fvg'},
 {t:100,k:'Detected',r:'pool'},
 {t:252,k:'Touch',r:'low70'},
 {t:271,k:'Traversal',r:'low70'},
 {t:274,k:'Return',r:'low70'},
 {t:285,k:'Acceptance',r:'low70',held:11},
 {t:285,k:'Confronted',o:'ob1',r:'low70',text:'82,870 holds if it is swept',verdict:'held'},
 {t:320,k:'Detected',r:'low58',from:'the sweep of 82,870'},
 {t:369,k:'Traversal',r:'pool'},
 {t:374,k:'Rejection',r:'pool'},
 {t:374,k:'Detected',r:'hi02',from:'the rejection at 83,100'},
 {t:485,k:'Touch',r:'fvg'}];
const NOW=630;
const clock=t=>{const m=(22*60+t)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const nm=r=>REG[r].name.toLowerCase()+' at '+REG[r].lvl;
const say=e=>({
 Detected:`A ${nm(e.r)} was recognised.`,
 Declared:`You declared: ${e.text}.`,
 Touch:`Price touched the ${nm(e.r)}.`,
 Traversal:`Price went through the ${nm(e.r)}.`,
 Return:`Price came back across the ${nm(e.r)}.`,
 Acceptance:`The ${nm(e.r)} was accepted, held for ${e.held} minutes.`,
 Rejection:`Price was turned back at the ${nm(e.r)}.`,
 Confronted:`Your claim met reality: ${e.text} — it held.`})[e.k];

function project(){ // fold the log into state
 const R={},O={};
 E.forEach(e=>{
  if(e.k==='Detected')R[e.r]={id:e.r,born:e.t,status:'open',touched:null,from:e.from};
  if(e.k==='Touch')R[e.r].touched=e.t;
  if(e.k==='Acceptance'){Object.assign(R[e.r],{status:'accepted',at:e.t,held:e.held})}
  if(e.k==='Rejection'){Object.assign(R[e.r],{status:'rejected',at:e.t})}
  if(e.k==='Declared')O[e.o]={id:e.o,text:e.text,r:e.r,at:e.t,status:'open'};
  if(e.k==='Confronted')Object.assign(O[e.o],{status:'held',resolved:e.t});
 });
 return{R,O};
}
function obj(title,rows,made,cls){
 return `<div class="obj fade"><h3>${title}</h3><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl><div class="made">${made}</div></div>`}

function draw(){
 const L=+left.value; lt.textContent=clock(L);
 const {R,O}=project();
 const away=E.filter(e=>e.t>L);
 const rr=away.filter(e=>e.k==='Acceptance'||e.k==='Rejection').length;
 const oo=away.filter(e=>e.k==='Confronted').length;
 const born=away.filter(e=>e.k==='Detected').length;
 const openNow=Object.values(R).filter(x=>x.status==='open').length+Object.values(O).filter(x=>x.status==='open').length;
 // lead + summary (silence is a valid answer)
 let lead,sum;
 if(!away.length){lead='Nothing has changed since you last looked.';sum=`${openNow} structure${openNow===1?'':'s'} remain open, as they were. You don\u2019t need to be here right now.`}
 else{
  const lastRes=[...away].reverse().find(e=>e.k==='Acceptance'||e.k==='Rejection');
  lead=lastRes?say(lastRes):say(away[away.length-1]);
  const p=[];if(rr)p.push(`${rr} region${rr>1?'s':''} resolved`);if(oo)p.push(`${oo} of your claims confronted`);if(born)p.push(`${born} new region${born>1?'s':''} recognised`);
  sum=`While you were away: ${p.join(', ')||'small movements only'}. ${openNow} still open.`}
 const set=(el,txt)=>{if(el.dataset.v!==txt){el.dataset.v=txt;el.textContent=txt;el.classList.remove('fade');void el.offsetWidth;el.classList.add('fade')}};
 set(document.getElementById('lead'),lead);set(document.getElementById('sum'),sum);
 document.getElementById('glow').style.background=`radial-gradient(closest-side,rgba(${away.length?'238,222,196':'206,216,238'},.75),rgba(238,222,196,0))`;

 // timeline (older than L is dimmed, then a marker)
 let tl='',marked=false;
 E.forEach(e=>{
  if(!marked&&e.t>L){tl+=`<div class="gap">you looked here, ${clock(L)}</div>`;marked=true}
  tl+=`<div class="ev ${e.t<=L?'old':''}"><time>${clock(e.t)}</time><div>${say(e)}${e.from?`<small>born from ${e.from}</small>`:''}</div></div>`});
 if(!marked)tl+=`<div class="gap">you looked here, ${clock(L)}</div>`;
 document.getElementById('tl').innerHTML=tl;
 document.getElementById('tc').textContent=away.length+' since';

 // open
 let op='';
 Object.values(O).filter(o=>o.status==='open'&&o.at<=NOW).forEach(o=>op+=obj('Claim by you',[['you said',o.text],['declared',clock(o.at)],['status','open']],'obligation, declared by you'));
 Object.values(R).filter(x=>x.status==='open').forEach(x=>{
  const g=REG[x.id];
  op+=obj(g.name,[['level',g.lvl],['recognised',clock(x.born)],
   ...(x.touched?[['touched',clock(x.touched)+', not resolved']]:[]),
   ['status',x.touched?'undetermined':'untested'],
   ...(x.from?[['born from',x.from]]:[])],'made by '+g.by)});
 document.getElementById('open').innerHTML=op||'<div class="none">Nothing open.</div>';
 document.getElementById('oc').textContent=openNow;

 // resolved
 let rs='';
 Object.values(R).filter(x=>x.status!=='open').forEach(x=>{
  const g=REG[x.id],a=x.status==='accepted';
  rs+=obj(a?'Acceptance':'Rejection',[['region',g.name.toLowerCase()+', '+g.lvl],['confirmed',clock(x.at)],
   ...(a?[['held',x.held+' minutes']]:[]),['status',x.status==='accepted'?'accepted':'rejected'],['seen',x.at>L?'while you were away':'before you left']],'made by '+g.by)});
 Object.values(O).filter(o=>o.status==='held').forEach(o=>rs+=obj('Claim confronted',[['you said',o.text],['met reality',clock(o.resolved)],['result','held'],['evidence','acceptance at 82,870']],'resolved by confrontation, not by activity'));
 document.getElementById('res').innerHTML=rs||'<div class="none">Nothing resolved yet.</div>';
 document.getElementById('rc').textContent=Object.values(R).filter(x=>x.status!=='open').length+Object.values(O).filter(x=>x.status==='held').length;
}
left.addEventListener('input',draw);draw();
</script>
</body>
</html>
