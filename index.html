<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarketBrain</title>
<style>
:root{--bg:#fff;--ink:#1b1b1b;--soft:#6b6558;--beam:255,190,0;--up:#16a34a;--down:#dc2626;--line:rgba(27,27,27,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130a;--ink:#f6f0df;--soft:#b3a98f;--line:rgba(246,240,223,.18)}}
:root[data-theme="dark"]{--bg:#17130a;--ink:#f6f0df;--soft:#b3a98f;--line:rgba(246,240,223,.18)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;position:relative;overflow-x:hidden}
.beam{position:fixed;inset:0;pointer-events:none;background:
radial-gradient(130% 95% at 88% -12%,rgba(var(--beam),.62),rgba(var(--beam),.26) 38%,rgba(var(--beam),0) 72%),
conic-gradient(from 196deg at 88% -12%,rgba(var(--beam),.20),rgba(var(--beam),0) 7%,rgba(var(--beam),.14) 12%,rgba(var(--beam),0) 19%,rgba(var(--beam),.12) 25%,rgba(var(--beam),0) 33%)}
main{position:relative;max-width:1100px;margin:0 auto;padding:28px clamp(20px,5vw,56px) 80px}
h1{margin:0;font-size:clamp(2rem,6vw,3.4rem);font-weight:700;letter-spacing:-.03em}
.sentence{margin:14vh 0 0;font-size:clamp(2.1rem,6.2vw,4.4rem);line-height:1.08;font-weight:600;letter-spacing:-.03em;max-width:17ch;transition:opacity .7s ease}
.sentence.out{opacity:0}
.bits{margin:42px 0 0;display:flex;flex-wrap:wrap;gap:10px 34px;font-size:1.05rem;color:var(--soft);transition:opacity .7s ease}
.bits.out{opacity:0}
.bits b{color:var(--ink);font-weight:600}
details{margin-top:34px;max-width:760px}
summary{cursor:pointer;font-size:1.1rem;font-weight:600;list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
summary:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
textarea{width:100%;min-height:150px;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.55);color:var(--ink);font:15px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) textarea{background:rgba(0,0,0,.25)}}
:root[data-theme="dark"] textarea{background:rgba(0,0,0,.25)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:600;padding:11px 20px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:none;color:var(--soft);padding:11px 4px;font-weight:500;text-decoration:underline}
.hint{color:var(--soft);font-size:.98rem;margin:8px 0 0;max-width:60ch;line-height:1.45}
.err{color:var(--down);font-size:1rem;margin-top:10px}
.chart{overflow-x:auto;margin-top:10px}
svg{display:block;min-width:640px;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.sentence,.bits{transition:none}}
</style>
</head>
<body>
<div class="beam"></div>
<main>
<h1>MarketBrain</h1>
<p class="sentence" id="sentence" aria-live="polite">Waiting for candles.</p>
<div class="bits" id="bits"></div>

<details id="chartBox" hidden>
<summary>Show the chart</summary>
<div class="chart"><svg id="svg" viewBox="0 0 900 340" role="img" aria-label="Candles with the opening gap marked"></svg></div>
</details>

<details id="inputBox" open>
<summary>Add candles</summary>
<textarea id="data" spellcheck="false" placeholder="2026-10-08 15:45, 5001.25, 5002.00, 4999.50, 5000.00&#10;2026-10-09 09:30, 5012.50, 5013.25, 5009.00, 5010.25"></textarea>
<p class="hint">One candle per line: date and time in New York time, then open, high, low, close. Any timeframe from 1m to 15m works. Include the previous session's last candles before 4:15pm.</p>
<div class="row"><button id="go">Read the gap</button><button class="ghost" id="test">Fill with test candles, not real</button></div>
<div class="err" id="err" role="alert"></div>
</details>
</main>
<script>
// RTHGap v1: prior close = close of last candle stamped before 16:15 NY on the previous date;
// open = open of first candle stamped at or after 09:30 NY. closes_required = 2.
const P={closeAt:16*60+15,openAt:9*60+30,closesRequired:2};
const $=id=>document.getElementById(id);
const fmt=n=>n.toFixed(2);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

function parse(t){
  const out=[];
  for(const l of t.split(/\r?\n/)){
    const c=l.trim().split(/[,\t;]/); if(c.length<5)continue;
    const d=c[0].trim().replace('T',' ').match(/^(\d{4}-\d{2}-\d{2}) (\d{1,2}):(\d{2})/); if(!d)continue;
    const n=c.slice(1,5).map(Number); if(n.some(isNaN))continue;
    out.push({d:d[1],m:+d[2]*60+ +d[3],o:n[0],h:n[1],l:n[2],c:n[3]});
  }
  return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.m-b.m);
}

function detect(cs){
  const days=[...new Set(cs.map(c=>c.d))];
  const day=[...days].reverse().find(d=>cs.some(c=>c.d===d&&c.m>=P.openAt&&c.m<P.closeAt));
  if(!day) return {error:'No candle at or after 9:30 on any day. Add today\'s session.'};
  const prev=days.filter(d=>d<day).pop();
  if(!prev) return {error:'Add the previous session too, so there is a close to measure from.'};
  const pc=cs.filter(c=>c.d===prev&&c.m<P.closeAt).pop();
  if(!pc) return {error:'The previous session has no candle before 4:15pm.'};
  const today=cs.filter(c=>c.d===day&&c.m>=P.openAt&&c.m<P.closeAt);
  const oc=today[0];
  if(oc.m-P.openAt>30) return {error:'The first candle after 9:30 starts at '+hm(oc.m)+'. Add the candles from 9:30.'};
  const a=pc.c,b=oc.o;
  if(a===b) return {none:true,day,prev};
  const lo=Math.min(a,b),hi=Math.max(a,b),up=b>a,size=hi-lo;
  let depth=0,streak=0,best=0,entered=false,trav=false,acc=false,away=0;
  for(const c of today){
    const dp=up?(hi-c.l)/size:(c.h-lo)/size;
    if(dp>0)entered=true;
    depth=Math.max(depth,Math.min(1,Math.max(0,dp)));
    const inside=c.c>=lo&&c.c<=hi;
    streak=inside?streak+1:0; best=Math.max(best,streak);
    if(streak>=P.closesRequired)acc=true;
    if(up?c.c<lo:c.c>hi)trav=true;
    away=(up?c.c>hi:c.c<lo)?away+1:0;
  }
  let status='untouched';
  if(trav)status='traversed';
  else if(acc&&streak>=1)status='accepted';
  else if(entered&&away>=P.closesRequired)status='rejected';
  else if(entered)status='inside';
  return {day,prev,a,b,lo,hi,up,size,depth,status,streak,ce:lo+size/2,q25:lo+size*.25,q75:lo+size*.75,
    opened:oc.m,last:today[today.length-1].m,today,ctx:cs.filter(c=>c.d===prev).slice(-24)};
}

function words(r){
  if(r.none)return 'No gap today. It opened at yesterday\'s close.';
  const head='Opened '+fmt(r.size)+' points '+(r.up?'above':'below')+' yesterday\'s close. ';
  const pct=Math.round(r.depth*100);
  const s={untouched:'Price hasn\'t gone back into the gap.',
    inside:'Price has gone '+pct+'% of the way back into the gap'+(r.depth>=.5?', past its midpoint':'')+', and hasn\'t settled.',
    accepted:'Price went back into the gap and has closed inside it '+r.streak+' time'+(r.streak>1?'s':'')+' running.',
    rejected:'Price went '+pct+'% of the way into the gap and came back out.',
    traversed:'Price crossed the whole gap and closed beyond it.'}[r.status];
  return head+s;
}

function bits(r){
  if(r.none)return '';
  const e=(k,v)=>'<span>'+k+' <b>'+v+'</b></span>';
  return e('Gap',fmt(r.lo)+' to '+fmt(r.hi))+e('Midpoint',fmt(r.ce))+e('Quarters',fmt(r.q25)+' and '+fmt(r.q75))+
    e('Opened',hm(r.opened)+' New York')+e('Latest candle',hm(r.last))+
    '<span>RTHGap v1, closes required '+P.closesRequired+'</span>';
}

function draw(r){
  const svg=$('svg'); if(r.none){$('chartBox').hidden=true;return;}
  const cs=[...r.ctx,...r.today],W=900,H=340,pad=14;
  const mx=Math.max(...cs.map(c=>c.h),r.hi),mn=Math.min(...cs.map(c=>c.l),r.lo);
  const y=v=>pad+(mx-v)/(mx-mn||1)*(H-2*pad),step=(W-2*pad)/cs.length,bw=Math.max(2,step*.62);
  let s='<rect x="0" y="'+y(r.hi)+'" width="'+W+'" height="'+Math.max(2,y(r.lo)-y(r.hi))+'" fill="rgb(255,190,0)" opacity=".28"/>';
  s+='<line x1="0" x2="'+W+'" y1="'+y(r.ce)+'" y2="'+y(r.ce)+'" stroke="currentColor" stroke-dasharray="5 5" opacity=".55"/>';
  cs.forEach((c,i)=>{const x=pad+i*step+step/2,col=c.c>=c.o?'var(--up)':'var(--down)';
    s+='<line x1="'+x+'" x2="'+x+'" y1="'+y(c.h)+'" y2="'+y(c.l)+'" stroke="'+col+'"/>';
    s+='<rect x="'+(x-bw/2)+'" y="'+y(Math.max(c.o,c.c))+'" width="'+bw+'" height="'+Math.max(1,Math.abs(y(c.o)-y(c.c)))+'" fill="'+col+'"/>';});
  svg.innerHTML=s; $('chartBox').hidden=false;
}

function run(){
  $('err').textContent='';
  const cs=parse($('data').value);
  if(!cs.length){$('err').textContent='No candles found. Each line needs a date and time, then open, high, low, close.';return;}
  const r=detect(cs);
  if(r.error){$('err').textContent=r.error;return;}
  const sEl=$('sentence'),bEl=$('bits');
  sEl.classList.add('out');bEl.classList.add('out');
  setTimeout(()=>{sEl.textContent=words(r);bEl.innerHTML=bits(r);draw(r);sEl.classList.remove('out');bEl.classList.remove('out');},700);
  $('inputBox').open=false;
}

function testCandles(){
  // synthetic, only for checking the logic: a gap up that is partly filled
  const L=[];let p=5000,seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280-.5;
  const add=(d,m,o,c)=>{const h=Math.max(o,c)+Math.abs(rnd())*2,l=Math.min(o,c)-Math.abs(rnd())*2;L.push([d+' '+hm(m),o,h,l,c].map((v,i)=>i?(+v).toFixed(2):v).join(', '));};
  for(let m=14*60;m<16*60+15;m+=15){const o=p,c=p+rnd()*2;add('2026-10-08',m,o,c);p=c;}
  p=p+12.5;
  const path=[0,-1.5,-3,-5,-7,-8,-6,-9,-10,-9.5,-8.5,-9];let base=p;
  path.forEach((dv,i)=>{const o=i?base+path[i-1]:p,c=base+dv;add('2026-10-09',9*60+30+i*15,o,c);});
  $('data').value=L.join('\n');run();
}
$('go').onclick=run;$('test').onclick=testCandles;
</script>
</body>
</html>
