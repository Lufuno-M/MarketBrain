<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MarketBrain</title>
<style>
:root{--ink:#1a1325;--mute:#6f6479;--faint:#a89db3;--pink:#ff5fa8;--yel:#ffcf33;color-scheme:light}
*{box-sizing:border-box}
html{background:#fff7fb;-webkit-text-size-adjust:100%}
body{margin:0;background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#ffffff5c,#ffffff3d);backdrop-filter:blur(36px) saturate(1.25);-webkit-backdrop-filter:blur(36px) saturate(1.25)}
.b{position:absolute;border-radius:50%;filter:blur(80px);opacity:.8;animation:drift 26s ease-in-out infinite alternate;transition:background-color 8s ease}
.b1{width:62vmax;height:62vmax;left:-18vmax;top:-16vmax;background:#ff7ab8}
.b2{width:56vmax;height:56vmax;right:-16vmax;top:-10vmax;background:#ffd23f;animation-duration:31s}
.b3{width:52vmax;height:52vmax;left:22vw;bottom:-26vmax;background:#fff;animation-duration:36s}
.b4{width:36vmax;height:36vmax;right:4vw;bottom:-8vmax;background:#ffb08a;opacity:.65;animation-duration:29s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}
#lamp{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;left:var(--x,50vw);top:var(--y,30vh);border-radius:50%;background:radial-gradient(circle,#fff8c980,#ffb3d94d 45%,transparent 70%);z-index:-1;pointer-events:none;transition:left .5s ease-out,top .5s ease-out}
header{max-width:980px;margin:0 auto;padding:56px 28px 20px}
h1{font-size:clamp(46px,9vw,92px);font-weight:700;letter-spacing:-.045em;margin:0;line-height:1}
header p{font-size:clamp(19px,2.6vw,26px);color:#4b3f57;margin:16px 0 24px;max-width:30em;line-height:1.35}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip,.tv,.go{font:inherit;font-size:15px;color:var(--ink);text-decoration:none;border:1px solid #ffffffc0;background:#ffffff70;box-shadow:inset 0 1px 0 #fff;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:99px;padding:9px 17px;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
.chip:hover,.tv:hover,.go:hover,.chip:focus-visible,.go:focus-visible,.tv:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px #ff5fa840;outline:none}
.chip.on{background:linear-gradient(90deg,var(--pink),var(--yel));border-color:transparent;font-weight:600}
.go{font-weight:600;background:linear-gradient(90deg,#ffd7ea,#fff0a8)}
#note{font-size:15px;color:var(--mute);margin:12px 0 0;min-height:1.4em}
main{max-width:980px;margin:0 auto;padding:0 28px 96px}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:44px 0 8px}
.m{border-radius:26px;margin:0 -16px;padding:0 16px;background:#ffffff40;border:1px solid #ffffffa8;box-shadow:inset 0 1px 0 #fffffff0,inset 0 -1px 0 #ffffff55,0 8px 30px #3b1d5a12;backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);transition:background .8s,box-shadow .8s}
.m:hover{background:#ffffff5c}
.m.open{background:#ffffff78;box-shadow:inset 0 1px 0 #fff,0 18px 50px #ff5fa81c}
.m.up{background:linear-gradient(120deg,#ff5fa826,#ffcf3330),#ffffff50;box-shadow:inset 0 1px 0 #fff,0 14px 44px #ff5fa830}
.m.dn{background:linear-gradient(120deg,#8b6bff22,#6fb4ff22),#ffffff50;box-shadow:inset 0 1px 0 #fff,0 14px 44px #8b6bff28}
.m.up.strong{background:linear-gradient(120deg,#ff5fa84d,#ffcf3366),#ffffff48;box-shadow:inset 0 1px 0 #fff,0 20px 64px #ff5fa860}
.m.dn.strong{background:linear-gradient(120deg,#8b6bff44,#6fb4ff44),#ffffff48;box-shadow:inset 0 1px 0 #fff,0 20px 64px #8b6bff52}
.m>button{all:unset;display:grid;grid-template-columns:1fr auto;gap:8px 16px;width:100%;cursor:pointer;padding:24px 0}
.m>button:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:14px}
.n{font-size:15px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:9px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 14px 3px var(--c)}
.m.up .dot,.m.dn .dot{animation:pulse 2.2s ease-in-out infinite}
.m.strong .dot{animation-duration:1.1s}
@keyframes pulse{50%{transform:scale(1.7)}}
.s{grid-column:1;font-size:clamp(26px,4.4vw,44px);font-weight:600;letter-spacing:-.025em;line-height:1.14;transition:opacity .6s,font-size .6s,color .6s}
.s.w{color:var(--faint)}
.s.calm{font-size:clamp(21px,3.4vw,32px);font-weight:500;color:var(--mute)}
.m.up .s,.m.dn .s{font-weight:700;color:var(--ink)}
.m.strong .s{font-weight:800;font-size:clamp(30px,5.2vw,52px)}
.x{grid-row:1/3;grid-column:2;align-self:center;width:42px;height:42px;border-radius:50%;background:#ffffffb0;display:grid;place-items:center;font-size:24px;color:var(--ink);transition:transform .4s,background .3s}
.m:hover .x{background:linear-gradient(135deg,var(--pink),var(--yel))}
.m.open .x{transform:rotate(45deg)}
.p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease,opacity .5s;opacity:0}
.m.open .p{grid-template-rows:1fr;opacity:1}
.p>div{overflow:hidden}
.tf{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.ch{height:440px;margin:6px 0 8px;border-radius:18px;overflow:hidden}
.rd{font-size:14px;color:var(--mute);min-height:1.5em;margin:0 0 10px}
.dl{font-size:15px;font-weight:600;color:var(--mute);margin:22px 0 8px}
.th{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
.msg{max-width:38em;padding:12px 15px;border-radius:18px;font-size:17px;line-height:1.5;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:linear-gradient(90deg,#ffd7ea,#fff0a8)}
.msg.a{align-self:flex-start;background:#ffffff80;border:1px solid #ffffffc0}
.ar{display:flex;gap:8px;margin:0 0 6px}
.ar input,.jr input[type=date]{font:inherit;font-size:16px;color:var(--ink);background:#ffffff80;border:1px solid #ffffffc0;border-radius:99px;padding:10px 16px;box-shadow:inset 0 1px 0 #fff}
.ar input{flex:1;min-width:0}
.ar input:focus,.jr textarea:focus{outline:2px solid var(--pink);outline-offset:1px}
.jr textarea{width:100%;min-height:110px;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);background:#ffffff80;border:1px solid #ffffffc0;border-radius:18px;padding:14px 16px;resize:vertical}
.en{margin:14px 0 0;padding:14px 16px;border-radius:18px;background:#ffffff66;border:1px solid #ffffffa8}
.en.sel{box-shadow:0 0 0 2px #ff5fa8}
.en .d{font-size:13px;color:var(--mute);margin:0 0 6px}
.en .t{font-size:17px;line-height:1.5;white-space:pre-wrap;margin:0 0 10px}
.en .tf{margin:0}
.f{padding:22px 0 26px;font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* liquid silver + living typography */
:root{--silver-hi:rgba(255,255,255,.96);--silver-mid:rgba(220,226,235,.66);--silver-low:rgba(151,162,178,.20);--silver-edge:rgba(255,255,255,.88)}
header h1{position:relative;display:inline-block;color:transparent;background:linear-gradient(112deg,#8d96a5 0%,#fdfefe 14%,#aab3c1 27%,#ffffff 39%,#8b95a5 53%,#f8fbff 67%,#aeb7c5 81%,#ffffff 100%);background-size:220% 100%;background-position:0% 50%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(255,255,255,.75));animation:mb-silver-drift 12s ease-in-out infinite alternate}
header h1::after{content:"";position:absolute;left:4%;right:4%;bottom:-.10em;height:.075em;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),rgba(163,174,190,.42),transparent);filter:blur(2px);opacity:.7;pointer-events:none}
@keyframes mb-silver-drift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.m{position:relative;isolation:isolate;overflow:hidden}
.m::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.42;background:radial-gradient(ellipse at 12% 0%,rgba(255,255,255,.94),transparent 38%),linear-gradient(118deg,transparent 22%,rgba(255,255,255,.38) 42%,transparent 59%);background-size:100% 100%,230% 100%;background-position:0 0,-120% 0;transition:opacity .6s ease,background-position 1.2s ease}
.m:hover::before,.m.open::before{opacity:.72;background-position:0 0,120% 0}
.s{transform:translateY(0);filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
.s.fresh{animation:mb-text-arrive .72s cubic-bezier(.2,.7,.2,1) both}
@keyframes mb-text-arrive{0%{opacity:.25;transform:translateY(5px);filter:drop-shadow(0 0 10px rgba(255,255,255,.95))}65%{opacity:1;transform:translateY(-1px);filter:drop-shadow(0 0 5px rgba(255,255,255,.55))}100%{opacity:1;transform:translateY(0);filter:drop-shadow(0 0 0 rgba(255,255,255,0))}}
.s{line-height:1.12;text-wrap:pretty;letter-spacing:-.035em}
.n{letter-spacing:.015em}
.rd,.f,.dl,#note{letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){header h1{animation:none!important}.s.fresh{animation:none!important}.m::before{transition:none!important}}

/* context fragments under the chart */
.fx{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;font-size:15px;line-height:1.5;color:var(--mute)}
.fx li{max-width:46em}
.fx b{color:var(--ink);font-weight:600;margin-right:6px}
.rd b{color:var(--ink);font-weight:600}
.chip.think{background:linear-gradient(90deg,#ffd7ea,#fff0a8);font-weight:600}
.chip.shuf{color:var(--mute)}
.f{padding-top:14px}
</style></head><body>
<div class="sky"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i></div><div id="lamp"></div>
<header>
<h1>MarketBrain</h1>
<p>What the market did while you weren't looking, in plain words. Tap a market to open it, then ask it a question.</p>
<div class="bar" id="bar"><a class="tv" href="https://www.tradingview.com/" target="_blank" rel="noopener">Open TradingView</a><button class="tv" id="tdkey">Data key</button><button class="tv" id="aikey">AI key</button></div>
<p id="note"></p>
</header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const TWELVE_KEY=localStorage.getItem('mb_td_key')||'';
const AI_MODEL='claude-sonnet-5-5',GH_MODEL='openai/gpt-4.1',GEMINI_MODEL='gemini-3.6-flash';
// Add or remove markets here. on:false hides one until you switch it on (change it to true or delete it).
// src:'b' = Binance (free, no key). src:'t' = Twelve Data (needs your Data key; the free plan allows about 8 requests a minute).
// etf:true marks a fund that trades only in US stock hours, not the 24-hour forex week.
const MARKETS=[
 {g:'Crypto',k:'BTC',name:'Bitcoin',src:'b',sym:'BTCUSDT',tv:'BINANCE:BTCUSDT'},
 {g:'Crypto',k:'ETH',name:'Ethereum',src:'b',sym:'ETHUSDT',tv:'BINANCE:ETHUSDT'},
 {g:'Crypto',k:'SOL',name:'Solana',src:'b',sym:'SOLUSDT',tv:'BINANCE:SOLUSDT'},
 {g:'Crypto',k:'BNB',name:'BNB',src:'b',sym:'BNBUSDT',tv:'BINANCE:BNBUSDT'},
 {g:'Crypto',k:'XRP',name:'XRP',src:'b',sym:'XRPUSDT',tv:'BINANCE:XRPUSDT'},
 {g:'Crypto',k:'DOGE',name:'Dogecoin',src:'b',sym:'DOGEUSDT',tv:'BINANCE:DOGEUSDT'},
 {g:'Crypto',k:'ADA',name:'Cardano',src:'b',sym:'ADAUSDT',tv:'BINANCE:ADAUSDT',on:false},
 {g:'Crypto',k:'AVAX',name:'Avalanche',src:'b',sym:'AVAXUSDT',tv:'BINANCE:AVAXUSDT',on:false},
 {g:'Crypto',k:'LINK',name:'Chainlink',src:'b',sym:'LINKUSDT',tv:'BINANCE:LINKUSDT',on:false},
 {g:'Forex and gold',k:'GBPUSD',name:'Pound / Dollar',src:'t',sym:'GBP/USD',tv:'FX:GBPUSD'},
 {g:'Forex and gold',k:'EURUSD',name:'Euro / Dollar',src:'t',sym:'EUR/USD',tv:'FX:EURUSD'},
 {g:'Forex and gold',k:'USDJPY',name:'Dollar / Yen',src:'t',sym:'USD/JPY',tv:'FX:USDJPY'},
 {g:'Forex and gold',k:'XAUUSD',name:'Gold / Dollar',src:'t',sym:'XAU/USD',tv:'OANDA:XAUUSD'},
 {g:'Forex and gold',k:'XAGUSD',name:'Silver / Dollar',src:'t',sym:'XAG/USD',tv:'OANDA:XAGUSD'},
 {g:'Forex and gold',k:'UUP',name:'Dollar (UUP fund)',src:'t',sym:'UUP',tv:'AMEX:UUP',etf:true},
 {g:'Forex and gold',k:'AUDUSD',name:'Aussie / Dollar',src:'t',sym:'AUD/USD',tv:'FX:AUDUSD',on:false},
 {g:'Forex and gold',k:'USDCAD',name:'Dollar / Loonie',src:'t',sym:'USD/CAD',tv:'FX:USDCAD',on:false},
 {g:'Forex and gold',k:'USDCHF',name:'Dollar / Franc',src:'t',sym:'USD/CHF',tv:'FX:USDCHF',on:false},
 {g:'Forex and gold',k:'NZDUSD',name:'Kiwi / Dollar',src:'t',sym:'NZD/USD',tv:'FX:NZDUSD',on:false},
 {g:'Forex and gold',k:'EURGBP',name:'Euro / Pound',src:'t',sym:'EUR/GBP',tv:'FX:EURGBP',on:false},
 {g:'Forex and gold',k:'GBPJPY',name:'Pound / Yen',src:'t',sym:'GBP/JPY',tv:'FX:GBPJPY',on:false},
 {g:'Indices',k:'SPX500',name:'S&P 500',src:'t',sym:'SPX',tv:'OANDA:SPX500USD',on:false},
 {g:'Indices',k:'US30',name:'Dow Jones',src:'t',sym:'DJI',tv:'OANDA:US30USD',on:false},
 {g:'Indices',k:'NAS100',name:'Nasdaq 100',src:'t',sym:'IXIC',tv:'OANDA:NAS100USD',on:false},
 {g:'Indices',k:'SPY',name:'S&P 500 (SPY fund)',src:'t',sym:'SPY',tv:'AMEX:SPY',etf:true,on:false},
 {g:'Indices',k:'QQQ',name:'Nasdaq 100 (QQQ fund)',src:'t',sym:'QQQ',tv:'NASDAQ:QQQ',etf:true,on:false},
 {g:'Indices',k:'TLT',name:'Long US bonds (TLT fund)',src:'t',sym:'TLT',tv:'NASDAQ:TLT',etf:true,on:false}
];
const TFS=[['1m',1,'1m','1min'],['5m',5,'5m','5min'],['15m',15,'15m','15min'],['30m',30,'30m','30min'],['1h',60,'1h','1h'],['1d',1440,'1d','1day']];
const HUES=['#ff5fa8','#ffcf33','#ff9a6b','#b98cff','#ff7ec9','#ffb800','#e86bd6'];
const MOVING=3,STRONG=5,LOOK=12;
const fmt=p=>p.toFixed(p<10?5:p<1000?3:2);
const ny=t=>new Date(t).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' New York time';
const span=m=>{if(m>=1440){const d=Math.round(m/1440);return d+(d===1?' day':' days')}return m>=120?Math.round(m/60)+' hours':m+' minutes'};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const tfl=t=>TFS.find(x=>x[1]===t)[0];
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const day=t=>new Date(t*1000).toISOString().slice(0,10);
const nice=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
let J=store.get('mb_journal',[]);const saveJ=()=>store.set('mb_journal',J);
const hsh=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const cap=s=>s[0].toUpperCase()+s.slice(1);

function motion(c,tfm){
 if(c.length<LOOK+20)return{k:'still'};
 const a=c[c.length-1].c,b=c[c.length-1-LOOK].c,net=a-b;
 const rng=c.slice(-60).reduce((s,x)=>s+(x.h-x.l),0)/Math.min(60,c.length);
 const r=Math.abs(net)/(rng||1);
 return{k:r>=STRONG?'strong':r>=MOVING?'moving':'still',up:net>0,pct:Math.abs(net)/b*100,span:LOOK*tfm,r};
}
function gapsOf(c){const g=[];for(let i=2;i<c.length;i++){const a=c[i-2],b=c[i];if(a.h<b.l)g.push({up:true,lo:a.h,hi:b.l,i});else if(a.l>b.h)g.push({up:false,lo:b.h,hi:a.l,i});}return g}
function read(c,tfm){
 const last=c[c.length-1];
 const open=gapsOf(c).filter(g=>{for(let j=g.i+1;j<c.length;j++){const k=c[j];if(g.up?k.l<=g.lo:k.h>=g.hi)return false}return true});
 const mid=g=>(g.lo+g.hi)/2;
 const near=open.sort((a,b)=>Math.abs(mid(a)-last.c)-Math.abs(mid(b)-last.c))[0];
 if(near){near.entered=false;for(let j=near.i+1;j<c.length;j++){const k=c[j];if(k.l<near.hi&&k.h>near.lo){near.entered=true;break}}}
 let run=0;if(near)for(let j=c.length-1;j>near.i&&c[j].c>=near.lo&&c[j].c<=near.hi;j--)run++;
 let sh=null,sl=null;
 for(let i=c.length-4;i>=3&&(!sh||!sl);i--){const w=c.slice(i-3,i+4);
  if(!sh&&c[i].h===Math.max(...w.map(x=>x.h)))sh={i,p:c[i].h};
  if(!sl&&c[i].l===Math.min(...w.map(x=>x.l)))sl={i,p:c[i].l};}
 let fib=null;
 if(sh&&sl){const down=sl.i>sh.i,range=sh.p-sl.p,end=down?sl.p:sh.p;
  fib={down,from:down?sh.p:sl.p,to:end,back:Math.abs(last.c-end)/range,lvl:r=>down?sl.p+r*range:sh.p-r*range};}
 const inside=!!near&&run>0;
 return{last,near,run,fib,sh,sl,open,tfm,inside,mo:motion(c,tfm),dist:near?Math.abs(mid(near)-last.c)/last.c:9};
}

/* ---- the card sentence: an opener about motion + a body about the gap, each with many phrasings.
   Every open card gets a different sentence, even when two markets are in the same state.
   Numbers stay exact; only the wording changes. Template variety, not AI. ---- */
function openers(mo){
 if(mo.k==='still')return['Quiet.','Barely stirring.','Calm here.','Not much happening.','Hardly any movement.','Nothing urgent.','Still waters.','Holding its breath.','Almost motionless.','A slow stretch.'];
 const D=mo.up?'up':'down',f=mo.k==='strong',p=mo.pct.toFixed(2),s=span(mo.span);
 return[`Moving ${D}${f?' fast':''}: ${p}% in the last ${s}.`,`${p}% ${D} over the last ${s}${f?', and quickly':''}.`,`Price has leaned ${D}${f?' hard':''}, ${p}% across ${s}.`,`A ${f?'fast ':''}drift ${D}: ${p}% in ${s}.`,`${mo.up?'Rising':'Falling'}${f?' fast':''}, ${p}% in ${s}.`,`Heading ${D}${f?' quickly':''}, ${p}% in ${s}.`,`In the last ${s}, ${p}% ${D}${f?' at speed':''}.`,`${cap(D)} ${p}% since ${s} ago${f?', in a hurry':''}.`,`A ${f?'sharp ':''}push ${D}: ${p}% over ${s}.`];
}
function bodies(r){
 const n=r.near;
 if(!n)return['No open gaps nearby.','Nothing unfinished close by.','No gap is waiting to be revisited.','Every gap in view has been filled.','There is no open gap in the loaded candles.','Nothing here to come back to.','The slate is clean: no open gaps.'];
 const sd=n.up?'buying':'selling',w=n.lo>r.last.c?'above':'below',run=r.run,pl=run===1?'':'s';
 if(r.inside)return[`The last ${run} consecutive close${pl} ${run===1?'is':'are'} inside a ${sd} gap.`,`Price is sitting in a ${sd} gap, ${run} close${pl} running.`,`A ${sd} gap is holding price: ${run} close${pl} in a row inside it.`,`Price has closed inside a ${sd} gap ${run} ${run===1?'time':'times'} running.`,`Right now price lives inside a ${sd} gap, ${run} close${pl} so far.`,`${run} straight close${pl} inside a ${sd} gap.`,`Price keeps settling inside a ${sd} gap: ${run} close${pl} and counting.`];
 if(n.entered)return[`The closest open ${sd} gap is ${w} price. Price has dipped into it before, but never all the way through.`,`A ${sd} gap sits ${w} price. It has been touched, never fully crossed.`,`${cap(w)} price there is a ${sd} gap that has been visited but not filled.`,`The nearest unfinished ${sd} gap is ${w}; price has entered it without crossing it.`,`Price has touched the ${sd} gap ${w} it without closing it.`,`One ${sd} gap is still open ${w} price, partly visited.`,`A half-visited ${sd} gap lies ${w} price.`];
 return[`The closest open ${sd} gap is ${w} price, and price hasn't come back to it yet.`,`A ${sd} gap waits ${w} price, untouched.`,`${cap(w)} price sits a ${sd} gap nobody has revisited.`,`Price hasn't returned to the ${sd} gap ${w} it.`,`An unvisited ${sd} gap lies ${w} price.`,`The ${sd} gap ${w} price is still intact.`,`${cap(w)} price, a ${sd} gap remains unvisited.`];
}
function build(m,used){
 const O=openers(m.res.mo),B=bodies(m.res),h=hsh(m.k+m.tf);let pick=null;
 for(const strict of[true,false])for(let t=0;t<O.length*B.length&&!pick;t++){
  const o=O[(h+t)%O.length],b=B[((h>>>3)+t*5+(t/O.length|0))%B.length];
  if(strict?(!used.o.has(o)&&!used.b.has(b)):!used.t.has(o+' '+b))pick=[o,b];
 }
 pick=pick||[O[h%O.length],B[(h>>>3)%B.length]];

const LOGIC=`How this page reads a chart (this is all it does):
Gap: three candles where the first high is below the third low (buying gap), or the first low is above the third high (selling gap). The space between is the gap. Open = no later candle has traded fully back through it. Entered = a later candle overlapped it without filling it. Closest = the open gap whose middle is nearest the latest price; size and importance are not weighed.
Swing: a candle whose high (or low) is the highest (lowest) of the 3 candles on each side. The latest swing high and low make the swing. Fib levels (50%, 70.5%) are measured on it; pullback is how much of the swing price has retraced.
Motion: net change over the last ${LOOK} candles divided by the average candle size over the last 60. ${MOVING} or more = moving, ${STRONG} or more = moving fast, otherwise quiet.
Blind spots: no liquidity pools, no count of broken swing lows, nothing drawn or set as alerts in TradingView, nothing older than the loaded candles, no news.`;

 const t=gm?(j.candidates?.[0]?.content?.parts||[]).map(b=>b.text||'').join('\n'):gh?(j.choices?.[0]?.message?.content||''):(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
 if(!t)throw 'The AI service returned no text. Check the key, model access, and limits.';return t;
}

async function getDaily(m){
 const ck='mb_d_'+m.k,c=store.get(ck,null),today=new Date().toISOString().slice(0,10);
 if(c&&(m.src==='t'?c.day===today:Date.now()-c.at<18e5))return c.d;
 try{
  let d;
  if(m.src==='b'){const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${m.sym}&interval=1d&limit=365`);if(!r.ok)throw 0;d=(await r.json()).map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));}
  else{if(!TWELVE_KEY)throw 'nokey';const j=await(await fetch(`https://api.twelvedata.com/time_series?interval=1day&outputsize=365&timezone=UTC&symbol=${encodeURIComponent(m.sym)}&apikey=${TWELVE_KEY}`)).json();if(!j.values)throw 0;
   d=j.values.map(x=>({t:Date.parse(x.datetime.slice(0,10)+'T00:00:00Z'),o:+x.open,h:+x.high,l:+x.low,c:+x.close})).reverse();}
  store.set(ck,{day:today,at:Date.now(),d});return d;
 }catch(e){if(c)return c.d;throw e}
}
async function getCandles(m,tf){
 if(tf===1440)return getDaily(m);
 const T=TFS.find(t=>t[1]===tf);
 if(m.src==='b'){
  const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${m.sym}&interval=${T[2]}&limit=300`);
  if(!r.ok)throw'feed';return(await r.json()).map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
 }
 const ck='mb_'+m.k+tf;
 try{const c=JSON.parse(localStorage.getItem(ck));if(c&&Date.now()-c.at<9e5)return c.d}catch(e){}
 if(!TWELVE_KEY)throw'nokey';
 const j=await(await fetch(`https://api.twelvedata.com/time_series?interval=${T[3]}&outputsize=300&timezone=UTC&symbol=${encodeURIComponent(m.sym)}&apikey=${TWELVE_KEY}`)).json();
 if(!j.values)throw'feed';
 const d=j.values.map(x=>({t:Date.parse(x.datetime.replace(' ','T')+'Z'),o:+x.open,h:+x.high,l:+x.low,c:+x.close})).reverse();
 try{localStorage.setItem(ck,JSON.stringify({at:Date.now(),d}))}catch(e){}
 return d;
}

 <div class="f"><a class="tv" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(m.tv)}" target="_blank" rel="noopener">See it on TradingView</a></div><ul class="fx"></ul></div></div>`;

function say(m,who,text){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;const th=m.el.querySelector('.th');th.appendChild(d);d.scrollIntoView({block:'nearest',behavior:'smooth'});return d}
async function ask(m,q){
 q=q.trim();if(!q||!m.res)return;
 say(m,'u',q);
 const key=localStorage.getItem('mb_ai_key');
 if(!key){say(m,'a','Typed questions need an AI key. Add one with the AI key button at the top. The quick questions work without it.');return}
 m.hist.push({role:'user',text:q});const w=say(m,'a','Reading…');
 try{const t=await callAI(key,sysFor(m),m.hist.slice(-7));m.hist.push({role:'assistant',text:t});w.textContent=t}
 catch(e){m.hist.pop();w.textContent=(e instanceof TypeError?"The browser couldn't reach the AI service. ":"The assistant couldn't answer: ")+(e.message||e)}
}
function draw(m){
 if(!m.sr||!m.res)return;
 m.lines.forEach(l=>m.sr.removePriceLine(l));m.lines=[];
 const pl=(price,title,color)=>m.lines.push(m.sr.createPriceLine({price,title,color,lineWidth:1,lineStyle:2,axisLabelVisible:true}));
 if(m.show.gap&&m.res.near){pl(m.res.near.hi,'gap top','#8b5cf6');pl(m.res.near.lo,'gap bottom','#8b5cf6');}
 if(m.show.fib&&m.res.fib){pl(m.res.fib.lvl(.5),'50%','#e0408f');pl(m.res.fib.lvl(.705),'70.5%','#e0408f');}
}
function jrender(m){
 const L=m.el.querySelector('.el'),es=J.filter(e=>e.k===m.k).sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at);
 const tx=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
 L.innerHTML=es.map(e=>`<div class="en${e.date===m.sel?' sel':''}" data-id="${e.id}"><p class="d">${nice(e.date)}${m.days&&!m.days.has(e.date)?' · outside this chart':''}${e.edited?' · edited':''}</p><p class="t">${tx(e.text)}</p><div class="tf"><button class="chip" data-a="edit">Edit</button><button class="chip" data-a="del">Delete</button></div></div>`).join('');
 if(m.sr&&m.days){const R=m.res,sw=R&&m.show.fib?[R.sh&&{time:m.c[R.sh.i].t/1000,position:'aboveBar',color:'#6f6479',shape:'arrowDown',text:'swing high'},R.sl&&{time:m.c[R.sl.i].t/1000,position:'belowBar',color:'#6f6479',shape:'arrowUp',text:'swing low'}].filter(Boolean):[];
  const jm=es.filter(e=>m.days.has(e.date)).map(e=>({time:m.days.get(e.date),position:'belowBar',color:'#ff5fa8',shape:'circle'})).sort((a,b)=>a.time-b.time).filter((x,i,a)=>!i||x.time!==a[i-1].time);
  m.sr.setMarkers(jm.concat(sw).sort((a,b)=>a.time-b.time))}
}
function paint(m){
 const el=m.el,mo=m.res.mo,mv=mo.k!=='still';
 // every card's sentence is dealt together, so no two cards say the same thing
 refreshSentences();
 el.classList.toggle('up',mv&&mo.up);el.classList.toggle('dn',mv&&!mo.up);el.classList.toggle('strong',mo.k==='strong');
 const sk='mb_seen_'+m.k+'_'+m.tf;m.seen=m.seen||{};
 if(!(m.tf in m.seen)){const pv=store.get(sk,null);m.seen[m.tf]=pv;if(!pv||Date.now()-pv.at>12e5)store.set(sk,{at:Date.now(),price:m.res.last.c,g:m.res.near?{lo:m.res.near.lo,hi:m.res.near.hi,up:m.res.near.up}:null})}
 ctx(m);

 m.days=new Map();m.c.forEach(x=>{const d=day(x.t/1000);if(!m.days.has(d))m.days.set(d,x.t/1000)});
 if(m.chart){m.chart.applyOptions({timeScale:{timeVisible:m.tf<1440}});m.sr.setData(m.c.map(x=>({time:x.t/1000,open:x.o,high:x.h,low:x.l,close:x.c})));draw(m);jrender(m);m.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,m.c.length-90),to:m.c.length+6});m.show_(m.c[m.c.length-1]);}
}
async function load(m){
 try{m.c=await getCandles(m,m.tf);m.res=read(m.c,m.tf);m.lastUpdated=Date.now();paint(m);}
 catch(e){m.s.classList.remove('w');m.s.classList.add('calm');m.s.textContent=e==='nokey'?'Add your Twelve Data key using the Data key button in the header.':m.src==='t'?'No data came back for this market. Check the key, or this market may need a paid Twelve Data plan.':'Couldn\'t reach the price feed. Try again in a moment.';}
}
function toggle(m,force){
 const o=m.el.classList.toggle('open',force);m.el.querySelector('button').setAttribute('aria-expanded',o);if(o){qdeal(m);qrender(m)}
 if(o&&m.res){const k=m.res.mo.k;if(k==='strong')buzz([40,70,40]);else if(k==='moving')buzz(25);}
 if(o&&m.res&&!m.chart){
  const rd=m.el.querySelector('.rd');
  const pr=m.res.last.c<10?5:m.res.last.c<1000?3:2,CM=LightweightCharts.CrosshairMode.Magnet,ln={color:'#1a1325',width:1,style:3,labelBackgroundColor:'#1a1325'};
  const nyd=(t,o)=>new Date(t*1000).toLocaleString('en-US',Object.assign({timeZone:'America/New_York'},o));
  m.chart=LightweightCharts.createChart(m.el.querySelector('.ch'),{autoSize:true,layout:{background:{color:'rgba(255,255,255,0)'},textColor:'#6f6479',fontSize:12},grid:{vertLines:{color:'#ffffff55'},horzLines:{color:'#ffffffa0'}},crosshair:{mode:CM,vertLine:ln,horzLine:ln},rightPriceScale:{borderVisible:false,scaleMargins:{top:.12,bottom:.12}},timeScale:{timeVisible:m.tf<1440,borderVisible:false,rightOffset:6,tickMarkFormatter:(t,ty)=>m.tf===1440?new Date(t*1000).toLocaleDateString('en-US',{timeZone:'UTC',day:'numeric',month:'short'}):ty<3?nyd(t,{day:'numeric',month:'short'}):nyd(t,{hour:'2-digit',minute:'2-digit',hour12:false})},localization:{timeFormatter:t=>m.tf===1440?nice(day(t)):nyd(t,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})+' NY'}});
  m.sr=m.chart.addCandlestickSeries({upColor:'#ff5fa8',downColor:'#ffc400',borderVisible:false,wickUpColor:'#ff5fa8',wickDownColor:'#e0a800',priceFormat:{type:'price',precision:pr,minMove:1/10**pr},priceLineColor:'#1a1325',priceLineStyle:0});
  m.show_=b=>{if(!b)return;const t=b.t||b.time*1000,o=b.o??b.open,h=b.h??b.high,l=b.l??b.low,c=b.c??b.close,Z=m.c[m.c.length-1].c;rd.innerHTML=`<b>${m.tf===1440?nice(day(t/1000)):ny(t)}</b> · open ${fmt(o)} · high ${fmt(h)} · low ${fmt(l)} · close ${fmt(c)} · body ${c>=o?'up':'down'} ${dst(m,c-o)} · range ${dst(m,h-l)} · ${same(Z,c)?'this is the latest close':'close is '+dst(m,Z-c)+(c<Z?' below':' above')+' the latest close'}`};
  m.chart.subscribeCrosshairMove(p=>{const b=p.time&&p.seriesData.get(m.sr);m.show_(b||m.c[m.c.length-1])});
  m.chart.subscribeClick(p=>{if(!p.time)return;m.sel=day(p.time);m.el.querySelector('input[type=date]').value=m.sel;jrender(m)});
  paint(m);
 }
}
for(const m of live){
 const el=m.el,ta=el.querySelector('textarea'),dt=el.querySelector('input[type=date]'),sv=el.querySelector('[data-j=save]'),cn=el.querySelector('[data-j=cancel]'),inp=el.querySelector('[data-ask]');

  if(m.editing){const e=J.find(x=>x.id===m.editing);if(e){e.text=text;e.date=dt.value;e.edited=true}}

  if(b.dataset.a==='del'&&confirm('Delete this entry?')){J=J.filter(x=>x!==e);saveJ();jrender(m)}};
 jrender(m);load(m);
}

bar.insertAdjacentHTML('afterbegin',['All',...groups].map((g,i)=>`<button class="chip${i?'':' on'}" data-f="${g}">${g}</button>`).join('')+'<button class="go" id="go">Show me what\'s moving</button>');

document.getElementById('go').onclick=()=>{
 const ready=live.filter(m=>m.res);
 if(!ready.length){note.textContent='Still reading the markets. Give it a second.';return;}
 const movers=ready.filter(m=>m.res.mo.k!=='still').sort((a,b)=>(b.res.mo.k==='strong')-(a.res.mo.k==='strong')||b.res.mo.pct-a.res.mo.pct);
 let pick=movers[0];
 if(pick)note.textContent=`${pick.k} is ${pick.res.mo.k==='strong'?'moving fast':'moving'} ${pick.res.mo.up?'up':'down'}.`;
 else{
  const g=ready.filter(m=>m.res.near);
  const ins=g.filter(m=>m.res.inside).sort((a,b)=>b.res.run*b.res.tfm-a.res.run*a.res.tfm)[0];
  pick=ins||g.sort((a,b)=>a.res.dist-b.res.dist)[0];
  if(!pick){note.textContent='Everything is quiet right now.';return;}
  note.textContent=ins?`Everything is quiet. ${pick.k} has been sitting in a gap the longest.`:`Everything is quiet. ${pick.k} is the closest to a gap.`;
 }
 document.querySelectorAll('[data-f]')[0].click();
 toggle(pick,true);pick.el.scrollIntoView({behavior:'smooth',block:'center'});
};
