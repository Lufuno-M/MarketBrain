<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MarketBrain</title>
<style>
:root{--ink:#1a1325;--mute:#6f6479;--faint:#a89db3;--pink:#ff5fa8;--yel:#ffcf33;color-scheme:light}
*{box-sizing:border-box}
html{background:#fff7fb;-webkit-text-size-adjust:100%}
body{margin:0;background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#ffffff5c,#ffffff3d);backdrop-filter:blur(36px) saturate(1.25);-webkit-backdrop-filter:blur(36px) saturate(1.25)}
.b{position:absolute;border-radius:50%;filter:blur(80px);opacity:.8;animation:drift 26s ease-in-out infinite alternate;transition:background-color 8s ease}
.b1{width:62vmax;height:62vmax;left:-18vmax;top:-16vmax;background:#ff7ab8}
.b2{width:56vmax;height:56vmax;right:-16vmax;top:-10vmax;background:#ffd23f;animation-duration:31s}
.b3{width:52vmax;height:52vmax;left:22vw;bottom:-26vmax;background:#fff;animation-duration:36s}
.b4{width:36vmax;height:36vmax;right:4vw;bottom:-8vmax;background:#ffb08a;opacity:.65;animation-duration:29s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}
#lamp{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;left:var(--x,50vw);top:var(--y,30vh);border-radius:50%;background:radial-gradient(circle,#fff8c980,#ffb3d94d 45%,transparent 70%);z-index:-1;pointer-events:none;transition:left .5s ease-out,top .5s ease-out}
header{max-width:1180px;margin:0 auto;padding:56px 28px 20px;transition:max-width .5s}
h1{font-size:clamp(46px,9vw,92px);font-weight:700;letter-spacing:-.045em;margin:0;line-height:1}
header p{font-size:clamp(19px,2.6vw,26px);color:#4b3f57;margin:16px 0 24px;max-width:30em;line-height:1.35}
.bar,.vb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.vb{margin-top:14px}
.chip,.tv,.go{font:inherit;font-size:15px;color:var(--ink);text-decoration:none;border:1px solid #ffffffc0;background:#ffffff70;box-shadow:inset 0 1px 0 #fff;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:99px;padding:9px 17px;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
.vb .chip,.vb .go{font-size:16px;padding:11px 20px}
.chip:hover,.tv:hover,.go:hover,.chip:focus-visible,.go:focus-visible,.tv:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px #ff5fa840;outline:none}
.chip.on{background:linear-gradient(90deg,var(--pink),var(--yel));border-color:transparent;font-weight:600}
.go{font-weight:600;background:linear-gradient(90deg,#ffd7ea,#fff0a8)}
#note{font-size:15px;color:var(--mute);margin:12px 0 0;min-height:1.4em}
main{max-width:1180px;margin:0 auto;padding:0 28px 130px;transition:max-width .5s}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:44px 0 8px}
.m{border-radius:26px;margin:0 -16px;padding:0 16px;background:#ffffff40;border:1px solid #ffffffa8;box-shadow:inset 0 1px 0 #fffffff0,inset 0 -1px 0 #ffffff55,0 8px 30px #3b1d5a12;backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);transition:background .8s,box-shadow .8s}
.m:hover{background:#ffffff5c}
.m.open{background:#ffffff78;box-shadow:inset 0 1px 0 #fff,0 18px 50px #ff5fa81c}
.m.up{background:linear-gradient(120deg,#ff5fa826,#ffcf3330),#ffffff50;box-shadow:inset 0 1px 0 #fff,0 14px 44px #ff5fa830}
.m.dn{background:linear-gradient(120deg,#8b6bff22,#6fb4ff22),#ffffff50;box-shadow:inset 0 1px 0 #fff,0 14px 44px #8b6bff28}
.m.up.strong{background:linear-gradient(120deg,#ff5fa84d,#ffcf3366),#ffffff48;box-shadow:inset 0 1px 0 #fff,0 20px 64px #ff5fa860}
.m.dn.strong{background:linear-gradient(120deg,#8b6bff44,#6fb4ff44),#ffffff48;box-shadow:inset 0 1px 0 #fff,0 20px 64px #8b6bff52}
.m>button{all:unset;display:grid;grid-template-columns:1fr auto;gap:8px 16px;width:100%;cursor:pointer;padding:24px 0}
.m>button:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:14px}
.n{font-size:17px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:9px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 14px 3px var(--c)}
.m.up .dot,.m.dn .dot{animation:pulse 2.2s ease-in-out infinite}
.m.strong .dot{animation-duration:1.1s}
@keyframes pulse{50%{transform:scale(1.7)}}
.s{grid-column:1;font-size:clamp(30px,5.4vw,58px);font-weight:600;letter-spacing:-.035em;line-height:1.12;text-wrap:pretty;transform-origin:left center;transition:opacity .6s,font-size .6s,color .6s,transform .4s}
.m:not(.open):hover .s{transform:scale(1.025)}
.s.w{color:var(--faint)}
.s.calm{font-size:clamp(24px,4vw,40px);font-weight:500;color:var(--mute)}
.m.up .s,.m.dn .s{font-weight:700;color:var(--ink)}
.m.strong .s{font-weight:800;font-size:clamp(34px,6.2vw,68px)}
.m.open .s{font-size:clamp(36px,6.6vw,76px);line-height:1.06}
.m.open .s.calm{font-size:clamp(30px,5vw,56px)}
.x{grid-row:1/3;grid-column:2;align-self:center;width:42px;height:42px;border-radius:50%;background:#ffffffb0;display:grid;place-items:center;font-size:24px;color:var(--ink);transition:transform .4s,background .3s}
.m:hover .x{background:linear-gradient(135deg,var(--pink),var(--yel))}
.m.open .x{transform:rotate(45deg)}
.p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease,opacity .5s;opacity:0}
.m.open .p{grid-template-rows:1fr;opacity:1}
.p>div{overflow:hidden}
.tf{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.tf .chip{font-size:16px}
.ch{height:clamp(340px,56vh,640px);margin:6px 0 8px;border-radius:18px;overflow:hidden}
.rd{font-size:15px;color:var(--mute);min-height:1.5em;margin:0 0 10px}
.dl{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:28px 0 10px}
.th{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
.msg{max-width:38em;padding:14px 17px;border-radius:18px;font-size:clamp(18px,2.2vw,21px);line-height:1.5;white-space:pre-wrap;animation:arrive .5s cubic-bezier(.2,.7,.2,1) both}
.msg.u{align-self:flex-end;background:linear-gradient(90deg,#ffd7ea,#fff0a8)}
.msg.a{align-self:flex-start;background:#ffffffb8;border:1px solid #ffffffc0;border-left:4px solid var(--c)}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}}
.qs .chip{font-size:16px;padding:11px 18px}
.ar{display:flex;gap:8px;margin:6px 0 10px;padding:6px;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--yel));box-shadow:0 14px 40px #ff5fa840}
.ar input,.jr input[type=date]{font:inherit;font-size:16px;color:var(--ink);background:#ffffff80;border:1px solid #ffffffc0;border-radius:99px;padding:10px 16px;box-shadow:inset 0 1px 0 #fff}
.ar input{flex:1;min-width:0;font-size:20px;padding:16px 24px;background:#fffffff2;border:0}
.ar .chip,.ar .chip.on{font-size:18px;padding:0 30px;border:0;background:#1a1325;color:#fff;font-weight:600}
.ar input:focus,.jr textarea:focus{outline:2px solid var(--pink);outline-offset:1px}
.jr textarea{width:100%;min-height:110px;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);background:#ffffff80;border:1px solid #ffffffc0;border-radius:18px;padding:14px 16px;resize:vertical}
.jr .dl{color:var(--mute)}
.en{margin:14px 0 0;padding:14px 16px;border-radius:18px;background:#ffffff66;border:1px solid #ffffffa8}
.en.sel{box-shadow:0 0 0 2px #ff5fa8}
.en .d{font-size:13px;color:var(--mute);margin:0 0 6px}
.en .t{font-size:17px;line-height:1.5;white-space:pre-wrap;margin:0 0 10px}
.en .tf{margin:0}
.f{padding:22px 0 26px;font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* liquid silver + living typography */
:root{--silver-hi:rgba(255,255,255,.96);--silver-mid:rgba(220,226,235,.66);--silver-low:rgba(151,162,178,.20);--silver-edge:rgba(255,255,255,.88)}
header h1{position:relative;display:inline-block;color:transparent;background:linear-gradient(112deg,#8d96a5 0%,#fdfefe 14%,#aab3c1 27%,#ffffff 39%,#8b95a5 53%,#f8fbff 67%,#aeb7c5 81%,#ffffff 100%);background-size:220% 100%;background-position:0% 50%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(255,255,255,.75));animation:mb-silver-drift 12s ease-in-out infinite alternate}
header h1::after{content:"";position:absolute;left:4%;right:4%;bottom:-.10em;height:.075em;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),rgba(163,174,190,.42),transparent);filter:blur(2px);opacity:.7;pointer-events:none}
@keyframes mb-silver-drift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.m{position:relative;isolation:isolate;overflow:hidden}
.m::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.42;background:radial-gradient(ellipse at 12% 0%,rgba(255,255,255,.94),transparent 38%),linear-gradient(118deg,transparent 22%,rgba(255,255,255,.38) 42%,transparent 59%);background-size:100% 100%,230% 100%;background-position:0 0,-120% 0;transition:opacity .6s ease,background-position 1.2s ease}
.m:hover::before,.m.open::before{opacity:.72;background-position:0 0,120% 0}
.s.fresh,.sc.fresh{animation:mb-text-arrive .72s cubic-bezier(.2,.7,.2,1) both}
@keyframes mb-text-arrive{0%{opacity:.25;transform:translateY(5px);filter:drop-shadow(0 0 10px rgba(255,255,255,.95))}65%{opacity:1;transform:translateY(-1px);filter:drop-shadow(0 0 5px rgba(255,255,255,.55))}100%{opacity:1;transform:translateY(0);filter:drop-shadow(0 0 0 rgba(255,255,255,0))}}
.n{letter-spacing:.015em}
.rd,.f,#note{letter-spacing:-.01em}

/* the reading: tiles that grow */
.fx{list-style:none;margin:22px 0 8px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.fx li{padding:20px 22px;border-radius:24px;background:#ffffff80;border:1px solid #ffffffc8;box-shadow:inset 0 1px 0 #fff,0 10px 30px #3b1d5a10;font-size:clamp(17px,2vw,20px);line-height:1.4;color:var(--mute);cursor:pointer;transition:transform .35s,box-shadow .35s,background .35s;animation:arrive .6s cubic-bezier(.2,.7,.2,1) both}
.fx li:nth-child(2){animation-delay:.06s}.fx li:nth-child(3){animation-delay:.12s}.fx li:nth-child(4){animation-delay:.18s}.fx li:nth-child(5){animation-delay:.24s}
.fx li:hover{transform:translateY(-3px);background:#ffffffb0;box-shadow:inset 0 1px 0 #fff,0 18px 44px #ff5fa830}
.fx li.big{grid-column:1/-1;font-size:clamp(24px,3.6vw,40px);line-height:1.22;color:var(--ink);letter-spacing:-.02em}
.fx b{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.fx b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px 2px var(--c)}
.fx .lead{color:var(--ink);font-weight:600;font-size:1.12em}
.fx .rest{display:block;margin-top:8px}
.fx .ak{display:inline-block;margin-top:14px;font-size:14px;padding:8px 15px}
.rd b{color:var(--ink);font-weight:600}
.chip.think{background:linear-gradient(90deg,#ffd7ea,#fff0a8);font-weight:600}
.chip.shuf{color:var(--mute)}
.f{padding-top:14px}

/* screens */
body.v-wall main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;max-width:1280px;align-content:start}
body.v-wall main h2{grid-column:1/-1;margin:28px 0 0}
body.v-wall .m{margin:0;padding:0 20px}
body.v-wall .m.open{grid-column:1/-1}
body.v-wall .m:not(.open) .s{font-size:clamp(22px,2.6vw,30px)}
body.v-focus main h2,body.v-focus header p:not(#note){display:none}
body.v-focus .m:not(.focus){display:none}
body.v-focus .m{margin:0;padding:0 24px}
body.v-focus .m.open .s{font-size:clamp(40px,8vw,92px)}
body.v-focus .ch{height:clamp(360px,60vh,700px)}
body.v-focus h1{font-size:clamp(30px,5vw,48px)}
main.swap{animation:arrive .55s cubic-bezier(.2,.7,.2,1)}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:8px;border-radius:99px;background:#ffffffb0;border:1px solid #fff;backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 14px 44px #3b1d5a30;max-width:calc(100vw - 20px)}
#dock button{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:99px;padding:12px 20px;cursor:pointer;color:var(--ink);background:#ffffffc0}
#dock .ask{background:linear-gradient(90deg,var(--pink),var(--yel))}
#dock .nv,#dock .lbl{display:none}
body.v-focus #dock .nv{display:block}
body.v-focus #dock .lbl{display:block;font-size:14px;color:var(--mute);padding:0 6px;white-space:nowrap}

/* marks: crosshair, magnet and drawings sit on the chart, and stay quiet until you reach for them */
.ch{position:relative}
.ch .mbc{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.dk{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:2px;max-width:calc(100% - 84px);padding:4px;border-radius:22px;background:#ffffff8c;border:1px solid #ffffffd0;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:inset 0 1px 0 #fff,0 6px 20px #3b1d5a14;opacity:.5;transition:opacity .5s}
.ch:hover .dk,.dk:focus-within,.ch.drawing .dk,.ch.sel .dk{opacity:1}
@media (hover:none){.dk{opacity:.92}}
.dk button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);padding:6px 11px;border-radius:99px;transition:background .3s,color .3s}
.dk button:hover{color:var(--ink);background:#ffffffb8}
.dk button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dk button.on{color:var(--ink);background:linear-gradient(90deg,#ffd7ea,#fff0a8)}
.dk button[hidden]{display:none}
.dk .dh{font-size:13px;color:var(--mute);padding:0 10px 0 6px}
.dk .dh:empty{display:none}
.ch.drawing,.ch.drawing *{cursor:crosshair!important;touch-action:none!important}
.ch.sel{touch-action:none}
@media (max-width:560px){.dk{left:6px;top:6px;max-width:calc(100% - 72px)}.dk button{font-size:12px;padding:5px 8px}.dk .dh{font-size:12px;padding:0 6px}}
.ch.pt,.ch.pt *{cursor:pointer!important}
.sc{grid-column:1;font-size:15px;line-height:1.4;color:var(--mute);letter-spacing:-.01em;max-width:44em}.sc:empty{display:none}
.tf .chip.hot{position:relative}.tf .chip.hot::after{content:"";position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 2px var(--c)}.tf .chip.unread{opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* MarketBrain workspace refinements — keep the original pink / yellow glass language. */
#tagline{transition:opacity .45s ease,transform .45s ease}#tagline.fresh{animation:mb-tagline-in .65s ease both}@keyframes mb-tagline-in{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.market-search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.market-search input{min-width:220px;max-width:440px;flex:1;padding:12px 16px;border-radius:99px;border:1px solid #ffffffc0;background:#ffffff70;color:var(--ink);font:inherit;box-shadow:inset 0 1px 0 #fff;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.market-search .hint{font-size:12px;color:var(--mute)}
.market-extra{margin:22px 0 26px;padding:18px 0;border-top:1px solid #ffffffa8;border-bottom:1px solid #ffffffa8;background:transparent}
.market-extra-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.market-extra-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.trade-actions,.broker-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.trade-actions button,.market-extra button,.market-extra a,.broker-links a{border:1px solid #ffffffc0;border-radius:99px;padding:9px 16px;color:var(--ink);background:#ffffff78;box-shadow:inset 0 1px 0 #fff;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);transition:transform .2s,background .2s,box-shadow .2s}
.trade-actions button:hover,.market-extra button:hover,.market-extra a:hover,.broker-links a:hover{transform:translateY(-1px);background:#ffffffb0;box-shadow:0 8px 22px #ff5fa826}
.trade-actions .buy{border-color:#73c99b;color:#267d50}.trade-actions .sell{border-color:#e58a91;color:#a83e49}
.market-extra .muted{color:var(--mute);font-size:12px}
.market-news-list{display:grid;gap:0;margin-top:12px}
.market-news-item{display:block;padding:12px 0;border-top:1px solid #ffffffa8;color:var(--ink);font-size:14px;line-height:1.45}
.market-news-item small{display:block;color:var(--mute);margin-top:4px;font-size:11px}
/* Instrument index: compact rows with a quiet selected state, not a stack of cards. */
body.v-cards .m{margin:0;padding:0 12px;border:0;border-bottom:1px solid #ffffffa8;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.v-cards .m:hover{background:#ffffff30;box-shadow:none}
body.v-cards .m.up,body.v-cards .m.dn,body.v-cards .m.up.strong,body.v-cards .m.dn.strong{background:transparent;box-shadow:none}
body.v-cards .m.open{margin:5px 0 12px;padding:0 16px;border:1px solid #ffffffb8;border-radius:20px;background:#ffffff50;box-shadow:inset 0 1px 0 #fff,0 12px 34px #3b1d5a14}
body.v-cards .m>button{display:grid;grid-template-columns:minmax(125px,170px) minmax(0,1fr) 34px;grid-template-rows:auto auto;align-items:center;gap:3px 16px;padding:14px 0}
body.v-cards .m .n{grid-column:1;grid-row:1/3;font-size:13px;white-space:nowrap;color:var(--mute)}
body.v-cards .m .s{grid-column:2;grid-row:1;font-size:18px;line-height:1.25;font-weight:600;letter-spacing:-.025em}
body.v-cards .m .sc{grid-column:2;grid-row:2;font-size:12px;line-height:1.35;color:var(--mute);max-width:none}
body.v-cards .m .x{grid-column:3;grid-row:1/3;width:32px;height:32px;font-size:19px}
body.v-cards .m.open .s{font-size:19px}
body.v-cards .m.open .s.calm{font-size:17px}
#dock .ask{background:linear-gradient(115deg,#ffffffc9,#fff0f7b8 55%,#fff4d9b8);border:1px solid #ffffffdf;color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 7px 22px #ff5fa826;backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35)}
#dock .ask:hover{background:linear-gradient(115deg,#fff,#fff3f9 55%,#fff8e8);box-shadow:inset 0 1px 0 #fff,0 10px 26px #ff5fa82e}
@media(max-width:640px){body.v-cards .m>button{grid-template-columns:105px minmax(0,1fr) 30px;gap:3px 10px;padding:12px 0}body.v-cards .m .n{font-size:11px;white-space:normal}body.v-cards .m .s,body.v-cards .m.up .s,body.v-cards .m.dn .s{font-size:15px}body.v-cards .m .sc{font-size:10px}body.v-cards .m .x{width:27px;height:27px;font-size:17px}}
/* The chart's accompanying evidence is a reading list, not a second wall of cards. */
.fx{list-style:none;margin:22px 0 12px;padding:0;display:block;border-top:1px solid #ffffffa8}
.fx-row{display:grid;grid-template-columns:minmax(125px,170px) minmax(0,1fr) auto;align-items:start;gap:10px 18px;padding:15px 0;border-bottom:1px solid #ffffffa8;color:var(--mute);font-size:15px;line-height:1.5;cursor:default}
.fx-row>b{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:700;padding-top:2px}
.fx-row .lead{color:var(--ink);font-weight:600}
.fx-row .rest{grid-column:2;display:block;margin-top:3px;color:var(--mute)}
.fx-row .ak{grid-column:3;grid-row:1/3;align-self:center;font-size:12px;padding:7px 12px;white-space:nowrap}

const LOGIC=`How this page reads a chart (this is all it does):
Gap: three candles where the first high is below the third low (buying gap), or the first low is above the third high (selling gap). The space between is the gap. Open = no later candle has traded fully back through it. Entered = a later candle overlapped it without filling it. Closest = the open gap whose middle is nearest the latest price; size and importance are not weighed.
Swing: a candle whose high (or low) is the highest (lowest) of the 3 candles on each side. The latest swing high and low make the swing. Fib levels (50%, 70.5%) are measured on it; pullback is how much of the swing price has retraced.
Motion: net change over the last ${LOOK} candles divided by the average candle size over the last 60. ${MOVING} or more = moving, ${STRONG} or more = moving fast, otherwise quiet.
Timeframes: each card reads up to six (1m, 5m, 15m, 30m, 1h, 1d) and opens on the one with the most going on: the nearest open gap changed since the last look, a swing was taken out within ${LOOK} candles, price is inside a gap, or motion. Each is judged against its own usual candle size, so no timeframe wins just for being busier by nature. "Quiet on every timeframe" is only said when all six were read and none stood out. Forex and index markets read only timeframes already fetched, to protect data credits.
Blind spots: no liquidity pools, no count of broken swing lows, nothing drawn or set as alerts in TradingView, nothing older than the loaded candles, no news.`;
const LOCAL={
 gap:m=>{const n=m.res.near;return 'A gap is a spot where three candles in a row moved so fast that the middle one left a space the first and third never touched. Markets often come back to check these.'+(n?` The closest open one here sits between ${fmt(n.lo)} and ${fmt(n.hi)}. ${n.entered?'Price has overlapped it since formation, without fully traversing it under the current rule.':'No overlap has been detected since it formed in the loaded candles.'} Price is now ${fmt(m.res.last.c)}.`:' No open gap is nearby right now.')},
 closest:()=>'"Open" means nothing has traded fully back through the gap since it formed. "Closest" means the open gap whose middle is nearest the latest price. It does not weigh how big or how important a gap is.',
 fib:m=>{const f=m.res.fib;return f?`The latest swing ran ${f.down?'down':'up'} from ${fmt(f.from)} to ${fmt(f.to)}. Price has pulled back ${Math.round(f.back*100)}% of it. The 50% level is ${fmt(f.lvl(.5))} and the 70.5% level is ${fmt(f.lvl(.705))}. A swing is a candle that is the highest or lowest of the three on each side.`:'No swing is clear enough in these candles yet.'},
 moving:()=>`"Moving" compares how far price travelled over the last ${LOOK} candles with the usual candle size on this chart. ${MOVING} times that is moving, ${STRONG} times is moving fast. Anything less says quiet.`,
 blind:m=>`This rests on ${m.src==='b'?'Binance':'Twelve Data'} prices for ${m.sym}: the last ${m.c.length} ${tfl(m.tf)} candles, about ${span(m.c.length*m.tf)}. It does not know liquidity pools, how many swing lows have broken, or anything you drew in TradingView. It describes the chart. It is not a prediction or advice.`
};
const unit=m=>m.src==='b'||m.etf||m.k==='XAUUSD'||m.k==='XAGUSD'?0:m.k.endsWith('JPY')?0.01:0.0001;
const dst=(m,d)=>{d=Math.abs(d);const u=unit(m);if(u)return (d/u).toFixed(1)+' pips';const px=m.c&&m.c.length?m.c[m.c.length-1].c:1;return '$'+d.toFixed(px<0.1?5:px<1?4:2)};
const ago=(m,i)=>{const k=m.c.length-1-i;return k<1?'on the latest candle':span(k*m.tf)+' ago'};
const hhmm=n=>String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const SES=[[180,'London opens'],[480,'New York opens'],[720,'London closes'],[1020,'New York closes'],[1140,'Asia opens']];
function nyNow(){const p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return{wd:p.weekday,min:(+p.hour%24)*60+ +p.minute}}
const closedNow=m=>{const{wd,min}=nyNow();return m.g==='Forex and gold'&&!m.etf&&(wd==='Sat'||(wd==='Fri'&&min>=1020)||(wd==='Sun'&&min<1020))};
function clock(m,more){
 const{min}=nyNow();
 if(closedNow(m))return 'The forex week is closed and reopens Sunday at 17:00 New York time. What you see is the last word from Friday.';
 const cur=min>=1140||min<180?'the Asia session':min<480?'the London session':min<720?'London and New York overlapping':min<1020?'the New York session':'the quiet hour between New York and Asia';
 const nx=SES.map(s=>[s[0],s[1],(s[0]-min+1440)%1440]).sort((a,b)=>a[2]-b[2]);
 return `It is ${hhmm(min)} in New York, during ${cur}. ${nx[0][1]} in ${span(nx[0][2])}`+(more?`, then ${nx[1][1]} in ${span(nx[1][2])}.`:'.')+(m.src==='b'?' Crypto never closes. These sessions are habits of people, not rules.':'');
}
const pos=m=>{const hi=Math.max(...m.c.map(x=>x.h)),lo=Math.min(...m.c.map(x=>x.l));return{hi,lo,p:(m.res.last.c-lo)/((hi-lo)||1)}};

/* what changed, and what did not, since this device last looked.

function fate(m,p){

function seen(m){

  g=f.k==='filled'?`The gap you saw (${fmt(p.g.lo)} to ${fmt(p.g.hi)}) was traded through. Confirmed in the loaded candles: ${ny(f.t)}.`
   :`The gap you saw (${fmt(p.g.lo)} to ${fmt(p.g.hi)}) is no longer in the loaded candles. The page cannot tell whether it was traded through or simply scrolled out of view.`;}

}

// split a reading into a bold lead sentence and the rest
const sp=t=>{const mm=t.match(/[.!?]\s+(?=[A-Z])/);return mm?[t.slice(0,mm.index+1),t.slice(mm.index+mm[0].length)]:[t,'']};

function ctx(m){

/* ---- interpretation without prediction: what is unfinished above and below, and where a reading would break ---- */
function around(m){

 const above=[up&&`a ${up.up?'buying':'selling'} gap at ${fmt(up.lo)} to ${fmt(up.hi)}`,sh&&`the swing high at ${fmt(sh.p)}`].filter(Boolean);
 const below=[dn&&`a ${dn.up?'buying':'selling'} gap at ${fmt(dn.lo)} to ${fmt(dn.hi)}`,sl&&`the swing low at ${fmt(sl.p)}`].filter(Boolean);

}
function cond(m){

 if(n)P.push(`Closes above the gap (${fmt(n.hi)}) would put price clear of it on top; closes below ${fmt(n.lo)}, clear of it underneath. Closes inside it mean it is still undecided.`);
 if(f)P.push(`On the swing from ${fmt(f.from)} to ${fmt(f.to)}, a close beyond ${fmt(f.from)} would undo the whole swing, and a close beyond ${fmt(f.to)} would extend it. The ${fmt(f.lvl(.705))} line is the deeper retracement mark in between.`);
 return `Shown: ${sentence(r)} Inferred: price is reacting to the structure around it, though the page cannot see why. ${P.join(' ')||'There is no gap or swing clear enough to build a reading on.'} These are places where the reading changes, not forecasts.`;

function act(m,tf,c,r){

 for(const[kind,s]of[['high',r.sh],['low',r.sl]]){if(!s)continue;for(let j=s.i+1;j<c.length;j++)if(kind==='high'?c[j].h>s.p:c[j].l<s.p){if(c.length-1-j<LOOK&&(!a.taken||j>a.taken.j))a.taken={kind,p:s.p,j};break}}

 a.score=(a.changed?100:0)+(a.taken?40:0)+(a.inside?20+Math.min(r.run,5):0)+Math.min(r.mo.r||0,STRONG)*6+(n?12/(1+d):0);
 return a}
function setRd(m,tf,c){const r=read(c,tf);ensureSeen(m,tf,r);m.rd[tf]={c,res:r,a:act(m,tf,c,r),at:Date.now()}}
function use(m,tf){const e=m.rd[tf];m.tf=tf;m.c=e.c;m.res=e.res;m.act=e.a;m.lastUpdated=e.at}

 if(a.taken)w.push(`the swing ${a.taken.kind} at ${fmt(a.taken.p)} was taken out ${ago({c:e.c,tf},a.taken.j)}`);

function cachedTf(m,tf){try{if(tf===1440){const c=store.get('mb_d_'+m.k,null);return c&&c.day===new Date().toISOString().slice(0,10)?c.d:null}const c=JSON.parse(localStorage.getItem('mb_'+m.k+tf));return c&&Date.now()-c.at<9e5?c.d:null}catch(e){return null}}

 const unitUsd=(m,p)=>usdBase(m)?1:p;

 const unreal=ps=>Object.entries(ps).reduce((a,[k,q])=>{const m=mOf(k),p=m&&priceOf(m);return a+(m&&p?pnl(m,q,p):0)},0);

 /* ---- the engine ---- */
 function place(m,side,amt,sl,tp){
  const p=priceOf(m);if(!p)return 'Waiting for a price.';if(!(amt>0))return 'Enter a size.';
  const qty=amt/(unitUsd(m,p)*ZAR),sg=side==='buy'?1:-1,old=paper.positions[m.k]||null,oq=old?old.qty:0;
  let nq=oq+sg*qty;if(oq&&Math.abs(nq)<Math.abs(oq)*1e-9)nq=0;
  const dir=Math.sign(nq);
  if(dir>0&&((sl&&sl>=p)||(tp&&tp<=p)))return 'Long: stop below price, target above.';
  if(dir<0&&((sl&&sl<=p)||(tp&&tp>=p)))return 'Short: stop above price, target below.';
  let real=0;if(oq&&Math.sign(oq)!==sg){const cq=Math.min(Math.abs(oq),qty);real=pnl(m,{avg:old.avg,qty:Math.sign(oq)*cq},p)}

  if(dir!==0){
   if(!oq||Math.sign(oq)!==dir)np={qty:nq,avg:p};
   else if(Math.sign(oq)===sg){const oa=Math.abs(oq);np={qty:nq,avg:(oa*old.avg+qty*p)/(oa+qty)}}
   else np={qty:nq,avg:old.avg};
   const keep=old&&dir===Math.sign(oq);
   if(sl)np.sl=sl;else if(keep&&old.sl)np.sl=old.sl;
   if(tp)np.tp=tp;else if(keep&&old.tp)np.tp=old.tp;
  }

  const seen=new Set(),out=[];
  for(const x of a){const t=String(x.title||'').trim(),lo=t.toLowerCase();if(!t||seen.has(lo.slice(0,60))||!/^https?:/.test(x.url||'')||!k.some(w=>lo.includes(w)))continue;
   const d=String(x.seendate||''),when=d.length>=15?Date.parse(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'T'+d.slice(9,11)+':'+d.slice(11,13)+':'+d.slice(13,15)+'Z'):NaN;
   if(isFinite(when)&&Date.now()-when>1296e5)continue;seen.add(lo.slice(0,60));out.push({title:t,url:x.url,domain:x.domain||'',when});if(out.length>=3)break}
  try{sessionStorage.setItem(ck,JSON.stringify({t:Date.now(),d:out}))}catch(e){}return out;
 }
 const agoT=t=>{if(!isFinite(t))return '';const h=(Date.now()-t)/36e5;return h<1?Math.max(1,Math.round(h*60))+'m':Math.round(h)+'h'};
 function drawNews(m){
  const el=m._news;if(!el)return;const n=m._st.news||[];el.hidden=!n.length;
  el.innerHTML=n.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}<small>${esc(x.domain)} · ${esc(agoT(x.when))}</small></a>`).join('');
 }

 /* ---- the ticket ---- */
 function drawSide(m){
  const s=m._side;if(!s)return;const p=priceOf(m),pos=paper.positions[m.k],box=$('[data-pos]',s),cl=$('[data-closepos]',s);
  $('[data-px]',s).textContent=p?fmt(p):'—';
  if(!pos){box.innerHTML=`<span class="cp-lbl">Account</span><strong class="cp-big">${R(equity())}</strong><span class="cp-sub">${R(avail())} available</span>`;cl.hidden=true}
  else{const pl=p?pnl(m,pos,p):0;box.innerHTML=`<span class="cp-lbl">${pos.qty<0?'Short':'Long'} ${esc(m.k)}</span><strong class="cp-big ${pl>=0?'up':'dn'}">${RS(pl)}</strong><span class="cp-sub">In at ${fmt(pos.avg)} · ${pos.sl?'stop '+fmt(pos.sl):'no stop'} · ${pos.tp?'target '+fmt(pos.tp):'no target'}</span><span class="cp-sub">Account ${R(equity())}</span>`;cl.hidden=false}
 }
 function renderAll(){
  levels();let amb='';
  for(const m of live){
   drawSide(m);const pos=paper.positions[m.k],p=priceOf(m);
   if(pos&&p&&m.el.classList.contains('open')){
    const pl=pnl(m,pos,p),tw=l=>{const sp=l-pos.avg;return sp?(p-pos.avg)/sp:0};
    amb=pos.sl&&tw(pos.sl)>=.7?'trade-near-sl':pos.tp&&tw(pos.tp)>=.7?'trade-near-tp':pl>=0?'trade-profit':'trade-drawdown';
   }
  }
  document.body.classList.remove('trade-profit','trade-drawdown','trade-near-sl','trade-near-tp');if(amb)document.body.classList.add(amb);
  if(amb!==lastAmb){if(amb==='trade-near-sl')buzz([70,50,70]);else if(amb==='trade-near-tp')buzz([40,40,40]);lastAmb=amb}
  const b=$('#demoopen');if(b)b.textContent='Account · '+R(equity());
  if(acct.classList.contains('show'))acctDraw();
 }

 /* ---- the account screen ---- */
 const acct=document.createElement('div');acct.id='acct';document.body.appendChild(acct);
 const tm=iso=>new Date(iso).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 function acctDraw(){
  const eq=equity(),un=unreal(paper.positions),re=paper.orders.reduce((a,o)=>a+(o.realisedZar||0),0),ps=Object.entries(paper.positions),cls=v=>v>=0?'up':'dn';
  const open=ps.map(([k,q])=>{const m=mOf(k),p=m&&priceOf(m),pl=m&&p?pnl(m,q,p):0;return `<div class="ac-row"><b>${esc(k)}</b><span>${q.qty<0?'Short':'Long'} ${esc(Math.abs(q.qty).toLocaleString('en-US',{maximumFractionDigits:6}))} · in ${fmt(q.avg)}${p?' · now '+fmt(p):''}</span><strong class="${cls(pl)}">${RS(pl)}</strong><button data-close="${esc(k)}">Close</button></div>`}).join('')||'<p class="ac-empty">Flat.</p>';
  const hist=paper.orders.slice(0,12).map(o=>`<div class="ac-row dim"><b>${esc(o.symbol)}</b><span>${esc(o.side.toUpperCase())} ${R(o.valueZar)} at ${fmt(o.price)}${o.why?' · '+esc(o.why):''} · ${esc(tm(o.at))}</span><strong class="${cls(o.realisedZar||0)}">${o.realisedZar?RS(o.realisedZar):''}</strong></div>`).join('')||'<p class="ac-empty">No trades yet.</p>';
  acct.innerHTML=`<div class="ac-in"><button class="ac-x" data-ac="close" aria-label="Close">×</button>
   <div class="ac-top"><span class="cp-lbl">Account</span><strong class="ac-eq">${R(eq)}</strong><span class="ac-d ${cls(eq-START)}">${RS(eq-START)}</span></div>
   <div class="ac-stats"><div><span>Available</span><strong>${R(avail())}</strong></div><div><span>Open</span><strong class="${cls(un)}">${RS(un)}</strong></div><div><span>Realised</span><strong class="${cls(re)}">${RS(re)}</strong></div><div><span>In use</span><strong>${R(exposure(paper.positions))}</strong></div></div>
   <h4>Open</h4>${open}<h4>History</h4>${hist}<button class="ac-reset" data-ac="reset">Reset to R${START.toLocaleString('en-US')}</button></div>`;
 }
 acct.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-close]');if(c){const m=mOf(c.dataset.close),p=m&&priceOf(m);if(m&&p){closeAt(m,p,'closed');buzz(20);renderAll()}return}
  const b=ev.target.closest('[data-ac]');if(!b)return;
  if(b.dataset.ac==='close')acct.classList.remove('show');
  else if(confirm('Reset the account? Positions and history are cleared.')){paper=fresh();persist();renderAll()}
 });
 addEventListener('keydown',e=>{if(e.key==='Escape')acct.classList.remove('show')});

 /* ---- header: next releases, auto-loaded; the account button ---- */
 const nwb=$('#nwopen');if(nwb){const h=document.createElement('div');h.id='nextup';nwb.replaceWith(h)}
 const nu=$('#nextup');let NU=null;
 function drawNext(){if(!nu||!NU)return;const now=Date.now();nu.innerHTML=NU.filter(x=>x.t>=now).slice(0,3).map((x,i)=>`<span class="nu${i?'':' first'}"><b>${cd(x.t)}</b> ${esc(x.country)} ${esc(x.title)}</span>`).join('')}
 econ().then(d=>{NU=d.filter(x=>x.impact==='High'&&['USD','EUR','GBP','JPY'].includes(x.country)).map(x=>({...x,t:Date.parse(x.date)})).filter(x=>isFinite(x.t)).sort((a,b)=>a.t-b.t);drawNext()},()=>{});
 const ab=$('#demoopen');if(ab)ab.onclick=()=>{acctDraw();acct.classList.add('show')};

 /* ---- brokers ---- */
 addEventListener('error',ev=>{const i=ev.target;if(i&&i.tagName==='IMG'&&i.classList&&i.classList.contains('bi')){const f=document.createElement('i');f.className='bi-fb';f.textContent=(i.dataset.n||'?')[0];i.replaceWith(f)}},true);
 const consent=document.createElement('div');consent.id='broker-consent';consent.innerHTML=`<div class="broker-panel" role="dialog" aria-modal="true"><h3 id="bc-t">Continue</h3><p class="broker-copy">Opens the provider's own site in a new tab.</p><div class="broker-actions"><button type="button" data-cancel>Cancel</button><button type="button" class="continue" data-continue>Continue</button></div></div>`;
 document.body.appendChild(consent);let bt=null;const bc=()=>{consent.classList.remove('show');bt=null};
 consent.querySelector('[data-cancel]').onclick=bc;consent.addEventListener('click',e=>{if(e.target===consent)bc()});
 consent.querySelector('[data-continue]').onclick=()=>{if(bt)window.open(bt,'_blank','noopener');bc()};
 document.addEventListener('click',e=>{const a=e.target.closest('[data-broker][data-url]');if(!a)return;e.preventDefault();bt=a.dataset.url;$('#bc-t',consent).textContent='Continue to '+a.dataset.broker;consent.classList.add('show')});

 /* ---- build each market's cockpit ---- */
 live.forEach(m=>{
  const panel=m.el.querySelector('.p>div');if(!panel)return;m._st={};
  const tfs=panel.querySelectorAll(':scope>.tf'),ch=panel.querySelector(':scope>.ch'),rd=panel.querySelector(':scope>.rd');
  if(tfs[0])tfs[0].classList.add('c-tf');if(tfs[1])tfs[1].classList.add('c-tg');if(ch)ch.classList.add('c-ch');if(rd)rd.classList.add('c-rd');
  const cal=document.createElement('div');cal.className='c-cal';panel.insertBefore(cal,panel.firstChild);m._cal=cal;
  const side=document.createElement('aside');side.className='c-side cp-side';
  side.innerHTML=`<div class="cp-px"><span class="cp-lbl">${esc(m.k)}</span><strong data-px></strong></div>
   <div class="cp-pos" data-pos></div>
   <div class="cp-size"><button type="button" data-amt="1000">R1k</button><button type="button" data-amt="5000">R5k</button><button type="button" data-amt="10000">R10k</button><button type="button" data-amt="25000">R25k</button></div>
   <input class="cp-in" data-size type="number" min="0" step="any" value="10000" aria-label="Size in rand">
   <div class="cp-lv"><input class="cp-in" data-sl type="number" min="0" step="any" placeholder="Stop price" aria-label="Stop loss"><input class="cp-in" data-tp type="number" min="0" step="any" placeholder="Target price" aria-label="Take profit"></div>
   <div class="cp-keys"><button type="button" class="sell" data-side="sell">Sell</button><button type="button" class="buy" data-side="buy">Buy</button></div>
   <div class="cp-msg" data-msg></div><button type="button" class="cp-close" data-closepos hidden>Close position</button>
   <div class="cp-news" hidden></div>`;
  (rd||ch||panel.firstChild).insertAdjacentElement('afterend',side);
  m._side=side;m._news=$('.cp-news',side);
  const size=$('[data-size]',side),msg=$('[data-msg]',side);
  side.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{size.value=b.dataset.amt;buzz(10)});
  side.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{
   const sd=b.dataset.side,err=place(m,sd,+size.value,+$('[data-sl]',side).value||null,+$('[data-tp]',side).value||null);
   msg.textContent=err||`${sd==='buy'?'Bought':'Sold'} ${R(+size.value)} at ${fmt(priceOf(m))}`;msg.classList.toggle('bad',!!err);
   if(!err){buzz([30,40,30]);$('[data-sl]',side).value='';$('[data-tp]',side).value=''}renderAll();
  });
  $('[data-closepos]',side).onclick=()=>{const p=priceOf(m);if(p){closeAt(m,p,'closed');msg.textContent='Closed at '+fmt(p);msg.classList.remove('bad');buzz(20);renderAll()}};
  drawCal(m);
 });
 const oldToggle=toggle;
 toggle=function(m,force){
  oldToggle(m,force);
  if(m.el.classList.contains('open')&&m._side){
   drawSide(m);renderAll();
   if(!m._loaded){m._loaded=true;
    econ().then(d=>{m._st.ev=evFor(m,d)},()=>{m._st.evErr=1}).then(()=>drawCal(m));
    headlines(m).then(v=>{m._st.news=v},()=>{m._st.news=[]}).then(()=>drawNews(m));}
  }
 };
 renderAll();
 setInterval(renderAll,5000);
 setInterval(()=>{drawNext();live.forEach(m=>{if(m._loaded)drawCal(m)})},30000);
 setInterval(async()=>{
  if(document.hidden)return;
  const a=live.find(x=>x.el.classList.contains('open')&&positionQty(x))||live.find(x=>x.el.classList.contains('open')&&x.src==='b');
  if(!a||a.tf===1440)return;
  try{if(a.src==='t')localStorage.removeItem('mb_'+a.k+a.tf);setRd(a,a.tf,await getCandles(a,a.tf));use(a,a.tf);paint(a);renderAll()}catch(e){}
 },60000);
 function positionQty(x){return paper.positions[x.k]?1:0}
})();
</script>
<style>
/* cockpit */

.nu{font-size:13px;color:var(--mute);padding:7px 13px;border-radius:99px;background:#ffffff66;border:1px solid #ffffffc0}
.nu b{color:var(--ink)}.nu.first{background:linear-gradient(90deg,#ffd7ea,#fff0a8)}.nu.first{color:var(--ink)}
.c-cal{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.c-cal::-webkit-scrollbar{display:none}
.ev{flex:0 0 auto;max-width:300px;padding:9px 14px;border-radius:16px;background:#ffffff66;border:1px solid #ffffffc0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.ev-t{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.ev-n{font-size:13px;color:var(--mute);line-height:1.3}
.ev small{font-size:11.5px;color:var(--mute)}
.ev.hi{border-left:3px solid var(--pink)}
.ev.past{opacity:.5}
.ev.next{background:linear-gradient(120deg,#ffd7ea,#fff0a8);box-shadow:0 8px 24px #ff5fa830}
.ev.next .ev-t{font-size:19px}.ev.next .ev-n{color:var(--ink);font-weight:600}
.ev.sess,.ev.quiet{background:transparent;border-style:dashed;box-shadow:none}
.ev.sess .ev-t{font-size:13px;font-weight:600;color:var(--mute)}
.ev-now{flex:0 0 2px;border-radius:2px;background:linear-gradient(var(--pink),var(--yel));opacity:.8}
.cp-side{padding:18px;border-radius:24px;background:#ffffff66;border:1px solid #ffffffc8;box-shadow:inset 0 1px 0 #fff,0 12px 34px #3b1d5a14;display:flex;flex-direction:column;gap:12px;margin:10px 0 14px}
.cp-px{display:flex;justify-content:space-between;align-items:baseline}
.cp-px strong{font-size:17px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.cp-pos{display:flex;flex-direction:column;gap:3px}
.cp-lbl{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700}
.cp-big{font-size:clamp(34px,4.4vw,48px);letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums}
.cp-big.up,.up{color:#1c8654}.cp-big.dn,.dn{color:#b8384a}
.cp-sub{font-size:13px;color:var(--mute)}
.cp-size{display:flex;gap:6px}

.cp-size button:active{transform:translateY(2px)}
.cp-in{width:100%;font:inherit;font-size:15px;color:var(--ink);padding:11px 14px;border-radius:14px;border:1px solid #ffffffc0;background:#ffffffa0;min-width:0}
.cp-lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cp-keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.cp-keys button{--edge:#2c9a69;--glow:#36b87955;min-height:58px;font:inherit;font-size:20px;font-weight:800;letter-spacing:.03em;border-radius:17px;border:1px solid #ffffffe6;cursor:pointer;box-shadow:inset 0 2px 0 #fffffff0,0 6px 0 var(--edge),0 16px 28px var(--glow);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.cp-keys .buy{color:#075b35;background:linear-gradient(125deg,#a9f0c9,#48c98a 60%,#baf4d7)}
.cp-keys .sell{--edge:#bd4457;--glow:#e5485d50;color:#7d1728;background:linear-gradient(125deg,#ffd0d2,#ef6878 60%,#ffb8b8)}
.cp-keys button:active{transform:translateY(5px);box-shadow:inset 0 3px 8px #00000026,0 1px 0 var(--edge)}
.cp-msg{font-size:13px;color:var(--mute);min-height:1.2em}.cp-msg.bad{color:#b8384a}
.cp-close{font:inherit;font-size:14px;font-weight:600;padding:10px;border-radius:14px;border:1px solid #ffffffc0;background:#ffffff80;color:var(--ink);cursor:pointer}
.cp-close[hidden],.cp-news[hidden]{display:none}
.cp-news{display:flex;flex-direction:column;border-top:1px solid #ffffffa8}
.cp-news a{padding:9px 0;border-bottom:1px solid #ffffff80;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.cp-news a:last-child{border:0}.cp-news small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
@media(min-width:980px){
 body.v-cards .m.open .p>div{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:20px;align-items:start;grid-template-areas:"cal cal" "tf side" "ch side" "rd side" "tg side"}
 body.v-cards .m.open .p>div>*{grid-column:1/-1}
 body.v-cards .m.open .p>div>.c-cal{grid-area:cal}
 body.v-cards .m.open .p>div>.c-tf{grid-area:tf}
 body.v-cards .m.open .p>div>.c-ch{grid-area:ch;height:clamp(420px,64vh,720px)}
 body.v-cards .m.open .p>div>.c-rd{grid-area:rd}
 body.v-cards .m.open .p>div>.c-tg{grid-area:tg}
 body.v-cards .m.open .p>div>.c-side{grid-area:side;margin-top:0;position:sticky;top:14px}
}
/* account screen */
#acct{position:fixed;inset:0;z-index:120;display:none;overflow:auto;background:linear-gradient(135deg,#fff9fdf2,#fff0f8ec 55%,#fff7e6f2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
#acct.show{display:block}
.ac-in{max-width:760px;margin:0 auto;padding:clamp(24px,5vw,56px) 22px 80px;position:relative}

.ac-top{display:flex;flex-direction:column;gap:4px;margin-bottom:26px}

.ac-row button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid #ffffffc0;background:#ffffff90;cursor:pointer;color:var(--ink)}

@media(max-width:640px){.ac-row{grid-template-columns:56px 1fr auto}.ac-row button{grid-column:2/4;justify-self:start}}
</style>
