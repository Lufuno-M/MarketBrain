<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarketBrain</title>
<style>
:root{--bg:#fff;--ink:#111827;--mute:#6b7280;--faint:#9ca3af;--hue:#e9effd;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--ink:#eceef2;--mute:#9aa1ad;--faint:#6b7280;--hue:#182033}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(60rem 30rem at 85% -10%,var(--hue),transparent 70%) var(--bg);color:var(--ink);
font:1rem/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;
padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.5rem calc(3rem + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 3rem;font-size:clamp(2rem,6vw,3.25rem);font-weight:700;letter-spacing:-.035em;line-height:1}
main{max-width:38rem}
p{margin:0}
.away{color:var(--mute)}
.away b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;margin:1rem 0 .25rem;accent-color:var(--ink)}
.hint{color:var(--faint);font-size:.875rem}
.sum{font-size:clamp(1.35rem,3.6vw,1.9rem);font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:2.5rem 0 2rem}
.ev{margin:0 0 1.1rem}
.ev span{display:block;color:var(--mute)}
h2{font-size:1rem;font-weight:600;margin:2.5rem 0 .75rem;color:var(--mute)}
.mark{margin:0 0 1.1rem}
form,.row{display:flex;gap:.75rem;align-items:baseline}
input[type=number]{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--faint);width:9rem;padding:.25rem 0}
button{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
button.x{color:var(--faint);font-size:.875rem}
footer{margin-top:3.5rem;color:var(--faint);font-size:.8125rem;max-width:34rem}
.err{color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.sum,.ev{transition:opacity .4s}}
</style>
</head>
<body>
<h1>MarketBrain</h1>
<main>
  <p class="away" id="away"></p>
  <input type="range" id="slider" aria-label="When you last looked" min="30" max="900" step="5">
  <p class="hint">Drag to change when you last looked.</p>
  <p class="sum" id="sum" aria-live="polite">Reading the last 16 hours of candles.</p>
  <div id="events"></div>
  <div id="standing"></div>
  <h2>Levels you marked</h2>
  <form id="f"><input type="number" id="lvl" step="any" min="0" placeholder="Price" aria-label="Price to mark"><button>Mark</button></form>
  <div id="marks" style="margin-top:1.25rem"></div>
  <footer id="prov"></footer>
</main>
<script>
// Every interpretive choice lives here and is printed in the footer.
const P={sym:'BTCUSDT',tf:'1m',N:10,A:3,look:15};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
const day=t=>new Date(t).toDateString()===new Date().toDateString()?'':new Date(t).toLocaleDateString([],{weekday:'short'})+' ';
const at=t=>day(t)+hm(t);
let C=[],R=[],marks=[],away=390;
try{marks=JSON.parse(localStorage.getItem('mb-marks')||'[]');away=+localStorage.getItem('mb-away')||390}catch(e){}
const save=()=>{try{localStorage.setItem('mb-marks',JSON.stringify(marks));localStorage.setItem('mb-away',away)}catch(e){}};

function mk(i,side){
  const n=P.N,L=side==='low'?C[i].l:C[i].h,r={side,L,born:C[i].t,det:C[i+n].t};
  const past=c=>side==='low'?c.c<L:c.c>L;
  for(let j=i+n+1;j<C.length;j++){
    const x=C[j];
    if(side==='low'?x.l<L:x.h>L){
      const w=C.slice(j,j+P.A);
      r.trav=x.t;
      r.ext=side==='low'?Math.min(...w.map(c=>c.l)):Math.max(...w.map(c=>c.h));
      r.out='Undetermined';
      for(let k=0;k<w.length;k++){
        if(!past(w[k])){r.out='Rejected';r.at=w[k].t;break}
        if(k===P.A-1){r.out='Accepted';r.at=w[k].t}
      }
      return r;
    }
  }
  return r;
}
function regions(){
  const n=P.N,out=[];
  for(let i=n;i<C.length-n;i++){
    let lo=true,hi=true;
    for(let k=1;k<=n&&(lo||hi);k++){
      if(C[i].l>=C[i-k].l||C[i].l>=C[i+k].l)lo=false;
      if(C[i].h<=C[i-k].h||C[i].h<=C[i+k].h)hi=false;
    }
    if(lo)out.push(mk(i,'low'));
    if(hi)out.push(mk(i,'high'));
  }
  return out;
}
const T0=()=>C[C.length-1].t+60000-away*60000;

function outcome(r){
  const dir=r.side==='low'?['above','below']:['below','above'];
  if(r.out==='Rejected')return `Rejected: a candle closed back ${dir[0]} at ${hm(r.at)}.`;
  if(r.out==='Accepted')return `Accepted: ${P.A} closes ${dir[1]} by ${hm(r.at+60000)}.`;
  return `Undetermined: fewer than ${P.A} candles have closed since.`;
}
function render(){
  if(!C.length)return;
  const T=T0(),now=C[C.length-1].t+60000,price=C[C.length-1].c;
  $('away').innerHTML=`Away since <b>${at(T)}</b>. It is <b>${hm(now)}</b>.`;
  $('slider').value=away;
  const ev=R.filter(r=>r.trav&&r.trav>T&&r.det<=now);
  const open=R.filter(r=>!r.trav);
  const cnt=o=>ev.filter(r=>r.out===o).length;
  $('sum').textContent=ev.length
    ?`Since ${hm(T)}, ${ev.length} ${ev.length===1?'region was':'regions were'} traversed: ${cnt('Rejected')} rejected, ${cnt('Accepted')} accepted, ${cnt('Undetermined')} undetermined. ${open.length} still untraversed.`
    :`Since ${hm(T)}, no region was traversed. ${open.length} still untraversed.`;
  $('events').innerHTML=ev.slice(-40).map(r=>
    `<p class="ev">The ${fmt(r.L)} ${r.side}, formed ${at(r.born)}${r.det>T?' while you were away':''}, was traversed at ${hm(r.trav)} (to ${fmt(r.ext)}).<span>${outcome(r)}</span></p>`).join('');
  const below=open.filter(r=>r.side==='low'&&r.L<price).sort((a,b)=>b.L-a.L)[0];
  const above=open.filter(r=>r.side==='high'&&r.L>price).sort((a,b)=>a.L-b.L)[0];
  const line=(r,w)=>r?`<p class="ev">Nearest untraversed ${r.side} ${w} price: ${fmt(r.L)}, formed ${at(r.born)}.</p>`:'';
  $('standing').innerHTML=line(above,'above')+line(below,'below');
  $('marks').innerHTML=marks.map((L,i)=>`<div class="mark"><div class="row"><b>${fmt(L)}</b><button class="x" data-i="${i}">remove</button></div><p class="away">${study(L,T,price)}</p></div>`).join('');
}
function study(L,T,price){
  const j=C.findIndex(c=>c.t>=T&&c.l<=L&&L<=c.h);
  const d=price-L,where=d>=0?'above':'below';
  if(j<0)return `Price has not reached ${fmt(L)} since ${hm(T)}. It is ${fmt(Math.abs(d))} ${where} now.`;
  const from=j>0&&C[j-1].c>L?'from above':'from below',w=C.slice(j,j+P.look);
  const hi=Math.max(...w.map(c=>c.h)),lo=Math.min(...w.map(c=>c.l));
  const up=w.filter(c=>c.c>L).length,dn=w.filter(c=>c.c<L).length;
  return `Reached ${from} at ${hm(C[j].t)}. Over the next ${w.length} minutes it traded from ${fmt(lo)} to ${fmt(hi)} (${fmt(Math.max(0,L-lo))} below the level, ${fmt(Math.max(0,hi-L))} above), with ${up} closes above and ${dn} below. Now ${fmt(Math.abs(d))} ${where}.`;
}
async function load(){
  try{
    const r=await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${P.sym}&interval=${P.tf}&limit=1000`);
    if(!r.ok)throw new Error(r.status);
    const a=await r.json();
    C=a.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    C.pop(); // the open candle has not closed, so it is not evidence yet
    R=regions();
    $('slider').max=Math.min(900,C.length-P.N*3);
    away=Math.min(away,+$('slider').max);
    render();
  }catch(e){
    $('sum').className='sum err';
    $('sum').textContent="Couldn't reach the candle source, so there is nothing honest to show. Reload to try again.";
  }
}
$('slider').addEventListener('input',e=>{away=+e.target.value;save();render()});
$('f').addEventListener('submit',e=>{e.preventDefault();const v=parseFloat($('lvl').value);if(v>0){marks.push(v);$('lvl').value='';save();render()}});
$('marks').addEventListener('click',e=>{const i=e.target.dataset.i;if(i!==undefined){marks.splice(+i,1);save();render()}});
$('prov').textContent=`Regions are swing extrema: the lowest low or highest high among ${P.N} ${P.tf} candles either side, known only ${P.N} candles later. A region is traversed when a wick passes its exact level, with no tolerance. Acceptance is ${P.A} closes beyond it; a close back inside first is rejection. Candles: ${P.sym} spot from Binance, closed candles only, so levels can differ by a few dollars from another venue.`;
load();
</script>
</body>
</html>
